  area = line + `L${px(total).toFixed(1)} ${y1}L${x0} ${y1}Z`;

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML =
    `<line class="grid" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>` +
    `<line class="grid" x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}"/>` +
    `<path class="area" d="${area}"/><path class="line" d="${line}"/>` +
    `<text class="axis" x="${x0}" y="${H - 3}">0 km</text>` +
    `<text class="axis" x="${x1}" y="${H - 3}" text-anchor="end">${nfmt(total / 1000, 1)} km</text>` +
    `<g id="elevCursor" style="display:none">` +
      `<line class="cross" y1="${y0}" y2="${y1}"/><circle class="puck" r="4"/></g>`;

  elevData = { elev, raw, total, lo, hi, x0, x1, y0, y1 };
  $("elevTip").textContent = "";
  tourMark("elev");                                   // beim ersten Mal kurz erklären
}

/* Fahren mit Maus oder Finger über das Profil: Fadenkreuz, Werte und ein
   Punkt an der passenden Stelle auf der Karte. */
function elevHover(clientX) {
  if (!elevData) return;
  const svg = $("elevChart");
  const rect = svg.getBoundingClientRect();
  const W = elevData.x1 + 4;
  const sx = (clientX - rect.left) * (W / rect.width);
  const t = Math.max(0, Math.min(1, (sx - elevData.x0) / (elevData.x1 - elevData.x0)));
  const d = t * elevData.total;
  let best = elevData.elev[0];
  for (const s of elevData.elev) if (Math.abs(s.d - d) < Math.abs(best.d - d)) best = s;

  const cur = svg.querySelector("#elevCursor");
  if (!cur) return;
  const X = elevData.x0 + (elevData.x1 - elevData.x0) * (elevData.total ? best.d / elevData.total : 0);
  const Y = elevData.y1 - (elevData.y1 - elevData.y0) * ((best.e - elevData.lo) / (elevData.hi - elevData.lo));
  cur.style.display = "";
  cur.querySelector("line").setAttribute("x1", X);
  cur.querySelector("line").setAttribute("x2", X);
  cur.querySelector("circle").setAttribute("cx", X);
  cur.querySelector("circle").setAttribute("cy", Y);
  $("elevTip").textContent = `${nfmt(best.d / 1000, 2)} km · ${Math.round(best.e)} m`;

  if (!elevMarker) {
    elevMarker = L.circleMarker([best.lat, best.lon], {
      radius: 6, weight: 3, color: cssVar("--bg"), fillColor: cssVar("--accent"), fillOpacity: 1, interactive: false
    }).addTo(map);
  } else {
    elevMarker.setLatLng([best.lat, best.lon]);
    if (!map.hasLayer(elevMarker)) elevMarker.addTo(map);
  }
}

function elevHoverEnd() {
  const cur = $("elevChart").querySelector("#elevCursor");
  if (cur) cur.style.display = "none";
  $("elevTip").textContent = "";
  if (elevMarker) { elevMarker.remove(); elevMarker = null; }
}

/* ================= Teilen, Link & Navigation ================= */
/* Kompakte, URL-sichere Kodierung des Streckenverlaufs (wie Google-Polyline,
   aber mit einem Alphabet ohne Zeichen, die in einer URL Ärger machen). */
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const B64I = (() => { const m = {}; for (let i = 0; i < 64; i++) m[B64[i]] = i; return m; })();

function encSigned(v, out) {
  let n = v < 0 ? ~(v << 1) : (v << 1);
  while (n >= 0x20) { out.push(B64[0x20 | (n & 0x1f)]); n >>>= 5; }
  out.push(B64[n]);
}

function encodePath(coords) {
  const out = [];
  let plat = 0, plon = 0;
  for (const c of coords) {
    const lat = Math.round(c[0] * 1e5), lon = Math.round(c[1] * 1e5);
    encSigned(lat - plat, out); encSigned(lon - plon, out);
    plat = lat; plon = lon;
  }
  return out.join("");
}

function decodePath(str) {
  const coords = [];
  let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    const vals = [];
    for (let k = 0; k < 2; k++) {
      let shift = 0, res = 0, b;
      do {
        b = B64I[str[i++]];
        if (b === undefined) return coords;
        res |= (b & 0x1f) << shift; shift += 5;
      } while (b >= 0x20 && i <= str.length);
      vals.push((res & 1) ? ~(res >> 1) : (res >> 1));
    }
    lat += vals[0]; lon += vals[1];
    coords.push([lat / 1e5, lon / 1e5]);
  }
  return coords;
}

/* Douglas-Peucker: der Verlauf bleibt auf ~8 m genau, der Link wird um ein
   Vielfaches kürzer. */
function simplifyPath(coords, tolM) {
  if (coords.length < 3) return coords.slice();
  const kx = Math.cos(toRad(coords[0][0])) * 111320, ky = 110540;
  const px = coords.map(c => [c[1] * kx, c[0] * ky]);
  const keep = new Uint8Array(coords.length);
  keep[0] = keep[coords.length - 1] = 1;
  const stack = [[0, coords.length - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    let idx = -1, maxD = tolM;
    const ax = px[a][0], ay = px[a][1];
    const dx = px[b][0] - ax, dy = px[b][1] - ay, len2 = dx * dx + dy * dy;
    for (let i = a + 1; i < b; i++) {
      const t = len2 ? Math.max(0, Math.min(1, ((px[i][0] - ax) * dx + (px[i][1] - ay) * dy) / len2)) : 0;
      const ex = ax + dx * t - px[i][0], ey = ay + dy * t - px[i][1];
      const d = Math.sqrt(ex * ex + ey * ey);
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (idx > 0) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
  }
  return coords.filter((_, i) => keep[i]);
}

/* Der Verlauf wird geglättet (4 m Toleranz) – Länge und Fahrzeit stehen
   deshalb als echte Werte mit im Link, statt aus der geglätteten Linie
   zurückgerechnet zu werden. */
function shareUrl(route) {
  const poly = encodePath(simplifyPath(route.coords, SHARE_TOL_M));
  const km = routeCtx.km || route.distance / 1000;
  return location.origin + location.pathname +
    `#r=1~${mode}~${(+km).toFixed(1)}~${Math.round(route.duration || 0)}~${Math.round(route.distance)}~${poly}`;
}

/* Google Maps kennt maximal ~9 Zwischenziele – die Schleife wird also
   angenähert. Für den exakten Verlauf gibt es GPX und den Link. */
function naviUrl(route) {
  const { pts } = sampleAlong(route.coords, 10);
  const inner = pts.slice(1, -1).map(p => `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`);
  const s = route.coords[0], e = route.coords[route.coords.length - 1];
  return "https://www.google.com/maps/dir/?api=1" +
    `&origin=${s[0].toFixed(5)},${s[1].toFixed(5)}` +
    `&destination=${e[0].toFixed(5)},${e[1].toFixed(5)}` +
    `&travelmode=${modeMeta(mode).gmaps}` +
    `&waypoints=${encodeURIComponent(inner.join("|"))}`;
}

async function copyShareLink() {
  if (!lastRoute) return;
  const url = shareUrl(lastRoute);
  try {
    await navigator.clipboard.writeText(url);
    toast(t("toast.linkCopied"));
  } catch {
    prompt(t("prompt.copyLink"), url);
  }
}

async function shareRoute() {
  if (!lastRoute) return;
  const name = routeTitle(lastRoute);
  if (navigator.canShare) {
    try {
      const file = new File([gpxString(lastRoute.coords, name)], gpxFileName(name), { type: "application/gpx+xml" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (e) { if (e.name === "AbortError") return; }
  }
  if (navigator.share) {
    try { await navigator.share({ title: name, text: name, url: shareUrl(lastRoute) }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  downloadGPX(lastRoute.coords, name);   // Desktop ohne Web Share: einfach die Datei
}

/* Geteilten Link beim Start öffnen: #r=1~modus~km~dauer~meter~verlauf */
function loadFromHash() {
  const m = /^#r=1~([a-z]+)~([\d.]*)~(\d*)~(\d*)~(.+)$/.exec(location.hash);
  if (!m) return false;
  const coords = decodePath(m[5]);
  if (coords.length < 2) return false;
  setMode(MODES[m[1]] ? m[1] : "foot");
  const km = parseFloat(m[2]);
  if (km > 0) distInput.value = km;
  let dist = parseInt(m[4], 10) || 0;
  if (!dist) for (let i = 1; i < coords.length; i++) dist += segLen(coords[i - 1], coords[i]);
  const duration = parseInt(m[3], 10) || 0;
  routeCtx = { targetM: (km > 0 ? km : dist / 1000) * 1000, profile: mode,
               tol: settings.tolerance / 100, km: km > 0 ? km : dist / 1000 };
  variants = []; activeVariant = 0;
  setStart(L.latLng(coords[0][0], coords[0][1]), false);
  drawRoute({ coords, waypoints: [], distance: dist, duration, overlap: 0,
              dev: km > 0 ? Math.abs(dist - km * 1000) / (km * 1000) : 0 });
  setStatusLive(() => t("status.shared", { dist: fmtDist(dist) }) +
    (duration ? " · " + t("status.approx", { dur: fmtDur(duration) }) : "") +
    ` · ${modeMeta(mode).emoji} ${modeName(mode)}`);
  return true;
}

/* ================= Gespeicherte Routen ================= */
function loadSavedRoutes() {
  try { return JSON.parse(localStorage.getItem("roundtrip-routes")) || []; } catch { return []; }
}
let savedRoutes = loadSavedRoutes();

function persistRoutes() {
  try { localStorage.setItem("roundtrip-routes", JSON.stringify(savedRoutes)); return true; }
  catch { toast(t("toast.saveFailed")); return false; }
}

/* Standardname: Ortsname (Reverse-Geocoding) + Distanz + Verkehrsmittel */
async function defaultRouteName() {
  let place = "";
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${start.lat}&lon=${start.lng}&zoom=14`,
      { headers: { "Accept-Language": langMeta().geo } });
    const a = (await res.json()).address || {};
    place = a.suburb || a.village || a.town || a.city_district || a.city || a.municipality || a.county || "";
  } catch { /* offline → ohne Ort */ }
  const km = nfmt(lastRoute.distance / 1000, 1);
  const kind = lastRoute.kind === "return" ? "↩️ " : "";
  return `${kind}${place ? place + " · " : ""}${km} km ${modeMeta(mode).emoji}`;
}

async function saveCurrentRoute() {
  if (!lastRoute || !start) return;
  saveBtn.disabled = true;
  const name = await defaultRouteName();
  savedRoutes.unshift({
    id: Date.now(), name, createdAt: new Date().toISOString(),
    mode, kind: lastRoute.kind || "loop",
    targetKm: lastRoute.kind === "return" ? 0 : parseFloat(distInput.value) || 0,
    start: { lat: start.lat, lng: start.lng },
    distance: lastRoute.distance, duration: lastRoute.duration, overlap: lastRoute.overlap || 0,
    waypoints: (lastRoute.waypoints || []).map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]),
    coords: lastRoute.coords.map(c => [+c[0].toFixed(5), +c[1].toFixed(5)]),
    elev: (lastRoute.elev || []).map(s => ({ d: Math.round(s.d), e: Math.round(s.e * 10) / 10, lat: s.lat, lon: s.lon }))
  });
  if (persistRoutes()) toast(t("toast.saved", { name }));
  saveBtn.disabled = false;
}

/* ---------- Sicherung: alles raus, alles rein ---------- */
function exportRoutes() {
  if (!savedRoutes.length) { toast(t("toast.noRoutes")); return; }
  const blob = new Blob(
    [JSON.stringify({ app: "roundtrip", version: 1, exportedAt: new Date().toISOString(), routes: savedRoutes })],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${t("file.export")}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(tn("toast.exported", savedRoutes.length));
}

function importRoutes(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : data && data.routes;
      if (!Array.isArray(list)) throw new Error(t("err.format"));
      const known = new Set(savedRoutes.map(r => r.id));
      let added = 0, skipped = 0;
      for (const r of list) {
        if (!r || !Array.isArray(r.coords) || r.coords.length < 2) { skipped++; continue; }
        const id = known.has(r.id) || !r.id ? Date.now() + Math.floor(Math.random() * 1e6) : r.id;
        if (known.has(r.id)) { skipped++; continue; }      // schon vorhanden → nicht doppeln
        known.add(id);
        savedRoutes.push({
          ...r, id,
          name: r.name || t("route.imported"),
          createdAt: r.createdAt || new Date().toISOString(),
          mode: MODES[r.mode] ? r.mode : "foot"
        });
        added++;
      }
      savedRoutes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      if (added && persistRoutes()) {
        renderRoutes();
        toast(tn("toast.imported", added,
          { skipped: skipped ? t("toast.imported.skipped", { n: nfmt(skipped) }) : "" }));
      } else if (!added) {
        toast(t("toast.importedNone"));
      }
    } catch (e) {
      toast(t("toast.importFailed", { err: e.message }));
    }
  };
  reader.onerror = () => toast(t("toast.readFailed"));
  reader.readAsText(file);
}

function renderRoutes() {
  const list = $("routesList");
  list.innerHTML = "";
  if (!savedRoutes.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "color:var(--muted);font-size:13px;";
    empty.textContent = t("routes.empty");
    list.appendChild(empty);
    return;
  }
  for (const r of savedRoutes) {
    const div = document.createElement("div");
    div.className = "routeItem";
    div.innerHTML = `<div class="rname"></div><div class="rmeta"></div>
      <div class="ractions">
        <button class="btn primary" data-act="load">${t("routes.load")}</button>
        <button class="btn" data-act="rename" title="${t("routes.rename.title")}" aria-label="${t("routes.rename.title")}">✏️<span class="lbl">${t("routes.rename.lbl")}</span></button>
        <button class="btn" data-act="gpx" title="${t("routes.gpx.title")}" aria-label="${t("routes.gpx.title")}">⬇️<span class="lbl">${t("routes.gpx.lbl")}</span></button>
        <button class="btn" data-act="del" title="${t("routes.del.title")}" aria-label="${t("routes.del.title")}">🗑️</button>
      </div>`;
    div.querySelector(".rname").textContent = r.name;
    const mm = modeMeta(r.mode);
    const hm = r.elev && r.elev.length > 1
      ? " · " + t("unit.climb", { n: Math.round(elevStats(smoothElev(r.elev)).asc) }) : "";
    div.querySelector(".rmeta").textContent =
      `${new Date(r.createdAt).toLocaleDateString(langLocale())} · ${fmtDist(r.distance)} · ` +
      `${t("status.approx", { dur: fmtDur(r.duration) })}${hm}` +
      ` · ${mm.emoji} ${modeName(r.mode)}${r.kind === "return" ? t("routes.meta.return") : ""}`;
    div.querySelector('[data-act=load]').onclick = () => loadSavedRoute(r);
    div.querySelector('[data-act=rename]').onclick = () => {
      const n = prompt(t("prompt.rename"), r.name);
      if (n && n.trim()) { r.name = n.trim(); persistRoutes(); renderRoutes(); }
    };
    div.querySelector('[data-act=gpx]').onclick = () => downloadGPX(r.coords, r.name);
    div.querySelector('[data-act=del]').onclick = () => {
      if (confirm(t("confirm.delRoute", { name: r.name }))) {
        savedRoutes = savedRoutes.filter(x => x.id !== r.id);
        persistRoutes(); renderRoutes();
      }
    };
    list.appendChild(div);
  }
}

function loadSavedRoute(r) {
  $("routesBg").style.display = "none";
  setMode(MODES[r.mode] ? r.mode : "foot");
  if (r.targetKm) distInput.value = r.targetKm;
  variants = []; activeVariant = 0;
  routeCtx = { targetM: (r.targetKm || r.distance / 1000) * 1000, profile: mode,
               tol: settings.tolerance / 100, km: r.targetKm || r.distance / 1000 };
  setStart(L.latLng(r.start.lat, r.start.lng), false,
           r.kind === "return" ? t("marker.returnStart") : undefined);
  drawRoute({
    coords: r.coords, waypoints: r.waypoints || [], kind: r.kind || "loop",
    distance: r.distance, duration: r.duration, overlap: r.overlap || 0,
    elev: r.elev && r.elev.length > 1 ? r.elev : null,
    dev: r.targetKm ? Math.abs(r.distance - r.targetKm * 1000) / (r.targetKm * 1000) : 0
  });
  setStatusLive(() => t("status.savedLoaded",
    { name: r.name, dist: fmtDist(r.distance), dur: t("status.approx", { dur: fmtDur(r.duration) }) }));
}

/* ================= Live-Standort =================
   Dauerhaft sichtbarer, blinkender blauer Punkt (wie in Google Maps) plus
   Genauigkeitskreis. Aktualisierung alle 3–5 s: watchPosition liefert
   Bewegungs-Updates, ein Heartbeat holt spätestens alle 4 s einen frischen Fix.
   Gezeichnet wird höchstens alle 3 s, damit die Karte ruhig bleibt. */
function secureEnough() {
  return window.isSecureContext || ["localhost", "127.0.0.1"].includes(location.hostname);
}

function ensureLiveLayers() {
  if (liveMarker) return;
  liveCircle = L.circle([0, 0], {
    radius: 0, interactive: false,
    color: "#1d6ef5", weight: 1, opacity: .35, fillColor: "#1d6ef5", fillOpacity: .12
  });
  liveMarker = L.marker([0, 0], {
    icon: L.divIcon({ className: "live-icon", html: '<div class="live-dot"></div>',
                      iconSize: [16, 16], iconAnchor: [8, 8] }),
    interactive: false, keyboard: false, zIndexOffset: -500  // Start-Marker bleibt obenauf
  });
}

function renderLive() {
  if (!livePos) return;
  ensureLiveLayers();
  const ll = [livePos.lat, livePos.lng];
  liveMarker.setLatLng(ll);
  // Genauigkeitskreis nur, wenn er größer als der Punkt selbst ist (sonst reine Optik-Störung)
  liveCircle.setLatLng(ll).setRadius(Math.min(livePos.accuracy || 0, 2000));
  if (!map.hasLayer(liveMarker)) liveMarker.addTo(map);
  const showCircle = (livePos.accuracy || 0) > 15;
  if (showCircle && !map.hasLayer(liveCircle)) liveCircle.addTo(map);
  else if (!showCircle && map.hasLayer(liveCircle)) liveCircle.remove();
  updateLiveFreshness();
}

/* Frische des Fixes: veraltet ⇒ Punkt hört auf zu blinken und wird grau */
function updateLiveFreshness() {
  const stale = !livePos || Date.now() - livePos.time > LIVE_STALE_MS;
  const el = liveMarker && liveMarker.getElement();
  const dot = el && el.querySelector(".live-dot");
  if (dot) dot.classList.toggle("stale", stale);
  if (liveBtnEl && !liveBtnEl.classList.contains("denied"))
    liveBtnEl.classList.toggle("live", !stale);
}

function scheduleLiveRender() {
  const wait = LIVE_MIN_RENDER_MS - (Date.now() - liveLastRender);
  if (wait <= 0) { liveLastRender = Date.now(); renderLive(); return; }
  if (!liveRenderTimer) {
    liveRenderTimer = setTimeout(() => {
      liveRenderTimer = null; liveLastRender = Date.now(); renderLive();
    }, wait);
  }
}

function onLivePos(pos, immediate) {
  livePos = { lat: pos.coords.latitude, lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy, time: Date.now() };
  trackAddPoint(livePos);      // zeichnet nur auf, wenn die Aufzeichnung läuft
  if (liveBtnEl) { liveBtnEl.classList.remove("denied"); liveBtnEl.title = t("live.setStart"); }
  if (immediate) {
    clearTimeout(liveRenderTimer); liveRenderTimer = null;
    liveLastRender = Date.now(); renderLive();
  } else {
    scheduleLiveRender();
  }
  // Erster Fix: Startpunkt höflich vorbelegen, solange noch keiner gesetzt ist
  if (liveFirstFix) {
    liveFirstFix = false;
    if (!start) setStart(L.latLng(livePos.lat, livePos.lng), true);
  }
}

function onLiveError(err) {
  if (err.code === 1) {   // PERMISSION_DENIED → Tracking beenden, nicht weiter nerven
    stopLiveTracking();
    if (liveBtnEl) {
      liveBtnEl.classList.remove("live");
      liveBtnEl.classList.add("denied");
      liveBtnEl.title = t("live.denied");
    }
  }
}

function pollLiveOnce() {
  if (document.hidden || !navigator.geolocation) return;
  if (livePos && Date.now() - livePos.time < LIVE_POLL_MS - 500) return; // watchPosition war schneller
  navigator.geolocation.getCurrentPosition(
    pos => onLivePos(pos), onLiveError,
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );
}

function startLiveTracking() {
  if (!navigator.geolocation || liveWatchId !== null) return;
  if (!secureEnough()) {
    if (liveBtnEl) { liveBtnEl.classList.add("denied"); liveBtnEl.title = t("live.insecure"); }
    return;
  }
  liveWatchId = navigator.geolocation.watchPosition(
    pos => onLivePos(pos), onLiveError,
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
  livePollTimer = setInterval(pollLiveOnce, LIVE_POLL_MS);
  liveStaleTimer = setInterval(updateLiveFreshness, 2000);
}

function stopLiveTracking() {
  if (liveWatchId !== null) { navigator.geolocation.clearWatch(liveWatchId); liveWatchId = null; }
  clearInterval(livePollTimer); livePollTimer = null;
  clearInterval(liveStaleTimer); liveStaleTimer = null;
  clearTimeout(liveRenderTimer); liveRenderTimer = null;
  updateLiveFreshness();
}

/* Im Hintergrund pausieren, beim Zurückkehren sofort einen frischen Fix holen */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && liveWatchId !== null) pollLiveOnce();
});

/* ================= Rückweg („Roundtrip But Later") =================
   Zwei Schritte, die zeitlich weit auseinanderliegen dürfen:

   1. Der Hinweg von A nach B wird per GPS mitgeschrieben (jeder Live-Fix
      landet gefiltert in `track`). Die Aufzeichnung liegt im localStorage
      und übersteht deshalb einen Neustart der Seite.
   2. Später genügt ein Knopfdruck: Von dort, wo man gerade steht, sucht die
      App einen Weg zurück zum Ausgangspunkt, der die aufgezeichnete Strecke
      möglichst wenig wiederholt.

   Zu 2. gibt es keine Router-Funktion „meide diese Linie" – die freien
   OSRM-Server können weder `exclude` auf Flächen noch Sperrungen. Also
   erzwingt die Suche das Ausweichen geometrisch: Zwischenpunkte auf einem
   Bogen, der sich zur Gegenseite des Hinwegs wölbt. Jeder Kandidat wird
   danach bewertet, wie viel von ihm tatsächlich auf dem Hinweg verläuft
   (`nearFraction`) und wie teuer der Umweg dafür ist. */

function emptyTrack() {
  return { points: [], distance: 0, recording: false, startedAt: null, mode: "foot" };
}
const trackCoords = () => track.points.map(p => [p[0], p[1]]);
const trackHasData = () => track.points.length >= 2;

/* ---------- Aufzeichnung ---------- */
/* Schreiben ist gedrosselt: ein Fix alle paar Sekunden soll nicht jedes Mal
   die ganze Strecke neu serialisieren. Beim Stoppen und beim Verlassen der
   Seite wird sofort geschrieben. */
function writeTrack() {
  try {
    if (!track.points.length) localStorage.removeItem(TRACK_KEY);
    else localStorage.setItem(TRACK_KEY, JSON.stringify(track));
  } catch { /* privater Modus oder Speicher voll – die Fahrt läuft trotzdem weiter */ }
}
function persistTrack(now) {
  if (now) { clearTimeout(trackSaveTimer); trackSaveTimer = null; writeTrack(); return; }
  if (!trackSaveTimer) trackSaveTimer = setTimeout(() => { trackSaveTimer = null; writeTrack(); }, TRACK_SAVE_MS);
}

/* Nimmt einen Live-Fix in die Aufzeichnung auf – oder eben nicht: zu ungenau,
   zu nah am letzten Punkt (Rauschen im Stand) oder ein Sprung, den man in der
   Zeit gar nicht zurücklegen kann. Liefert true, wenn der Punkt gezählt wurde. */
function trackAddPoint(p) {
  if (!track.recording || !p || !isFinite(p.lat) || !isFinite(p.lng)) return false;
  if (p.accuracy > TRACK_MAX_ACC) return false;
  const pt = [+p.lat.toFixed(5), +p.lng.toFixed(5), p.time || Date.now()];
  const last = track.points[track.points.length - 1];
  if (last) {
    const d = segLen([last[0], last[1]], [pt[0], pt[1]]);
    if (d < TRACK_MIN_M) return false;
    // Zeitfenster mindestens 3 s: nach einer Pause im Hintergrund ist auch ein
    // großer Abstand echt, nur der unmögliche Sprung soll auffliegen.
    const dt = Math.max(3, (pt[2] - last[2]) / 1000);
    if (d > modeMeta(track.mode).maxMs * dt) return false;
    track.distance += d;
  }
  track.points.push(pt);
  renderTrack();
  // Die ersten beiden Punkte schalten Verwerfen und Rückweg frei; danach genügt
  // es, die Zahlen fortzuschreiben – der Rest der Box ändert sich nicht mehr.
  if (track.points.length <= 2) renderTrackUI();
  else renderTrackStats();
  persistTrack();
  return true;
}

function startRecording(resume) {
  if (!navigator.geolocation) { toast(t("toast.noGeoDevice")); return false; }
  if (!secureEnough()) { toast(t("toast.needHttps")); return false; }
  track.recording = true;
  if (!track.startedAt) track.startedAt = Date.now();
  if (!resume) track.mode = mode;
  startLiveTracking();                       // war vielleicht gestoppt (z. B. nach Verweigerung)
  if (livePos && Date.now() - livePos.time < LIVE_FRESH_MS) trackAddPoint(livePos);
  else if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
    pos => onLivePos(pos, true), onLiveError, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  clearInterval(trackTickTimer);
  trackTickTimer = setInterval(renderTrackStats, 1000);   // Dauer soll auch im Stehen weiterlaufen
  persistTrack(true);
  renderTrackUI();
  if (!resume) toast(t("toast.recStarted"));
  return true;
}

function stopRecording() {
  if (!track.recording) return;
  track.recording = false;
  clearInterval(trackTickTimer); trackTickTimer = null;
  persistTrack(true);
  renderTrackUI();
}

function discardTrack() {
  if (trackHasData() && !confirm(t("confirm.discardTrack"))) return;
  track = emptyTrack();
  returnRoutes = []; returnBase = null;
  clearInterval(trackTickTimer); trackTickTimer = null;
  persistTrack(true);
  renderTrack();
  renderTrackUI();
}

/* Beim Laden: liegt eine Aufzeichnung im Speicher, kommt sie zurück auf die
   Karte – lief sie noch, wird sie fortgesetzt. Genau dafür ist das Ganze da:
   Die App darf zwischen Hin- und Rückweg geschlossen worden sein. */
function restoreTrack(applyMode) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(TRACK_KEY)); } catch { saved = null; }
  const pts = saved && Array.isArray(saved.points)
    ? saved.points.filter(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]))
    : [];
  if (!pts.length) { renderTrackUI(); return false; }
  track = { points: pts, distance: 0, recording: !!saved.recording,
            startedAt: saved.startedAt || pts[0][2] || null,
            mode: MODES[saved.mode] ? saved.mode : "foot" };
  // Länge lieber neu rechnen als der gespeicherten Zahl vertrauen
  track.distance = pathLength(trackCoords());
  if (applyMode) setMode(track.mode);
  renderTrack();
  if (track.recording && !startRecording(true)) track.recording = false;
  renderTrackUI();
  return true;
}

/* ---------- Darstellung ---------- */
function renderTrack() {
  const coords = trackCoords();
  if (coords.length < 2) {
    if (trackLine) { trackLine.remove(); trackLine = null; }
    if (trackDestMarker) { trackDestMarker.remove(); trackDestMarker = null; }
    return;
  }
  if (trackLine) trackLine.setLatLngs(coords);
  else trackLine = L.polyline(coords, { color: cssVar("--track"), weight: 4, opacity: .85,
                                        interactive: false }).addTo(map);
  if (trackDestMarker) trackDestMarker.setLatLng(coords[0]);
  else trackDestMarker = L.circleMarker(coords[0], { radius: 7, color: cssVar("--bg"), weight: 3,
                                                     fillColor: cssVar("--track"), fillOpacity: 1 })
    .addTo(map).bindTooltip(t("track.tooltip"));
}

function trackDuration() {
  if (!track.points.length) return 0;
  const first = track.points[0][2], last = track.points[track.points.length - 1][2];
  return Math.max(0, ((track.recording ? Date.now() : last) - first) / 1000);
}

function renderTrackStats() {
  $("trackStats").textContent = track.points.length
    ? `${fmtDist(track.distance)} · ${fmtDur(trackDuration())} · ${tn("track.points", track.points.length)}`
    : "";
}

function renderTrackUI() {
  const rec = track.recording, has = trackHasData();
  $("trackTitle").innerHTML = rec ? `<span class="recdot"></span> ${t("track.recording")}`
                            : has ? t("track.recorded")
                                  : t("track.later");
  const recBtn = $("recBtn");
  recBtn.classList.toggle("rec", rec);
  const recState = rec ? "stop" : track.points.length ? "resume" : "start";
  recBtn.innerHTML = (rec ? "⏹" : "⏺") +
    `<span class="lbl">${t("track.rec.lbl." + recState)}</span>`;
  const recLabel = t("track.rec.title." + recState);
  recBtn.title = recLabel;
  recBtn.setAttribute("aria-label", recLabel);

  $("trackDelBtn").style.display = track.points.length ? "" : "none";
  $("backRow").style.display = has ? "" : "none";
  $("backBtn").textContent = returnRoutes.length ? t("track.back.other") : t("track.back.find");
  $("trackHint").innerHTML = rec
    ? t("track.hint.rec")
    : has ? t("track.hint.has", { dist: fmtDist(track.distance) })
          : t("track.hint.none");
  renderTrackStats();
}

/* ---------- Rückweg suchen ---------- */
/* Anteil einer Route, der nahe (≤ ~70 m) an einer der übergebenen Linien
   verläuft – dasselbe Rasterverfahren wie overlapAnalysis, nur zwischen
   verschiedenen Linien statt innerhalb einer. Der Nahbereich um Start und
   Ziel zählt nicht mit: Dort gibt es nur eine Haustür, die Wiederholung ist
   unvermeidbar und wäre als Malus unfair. */
function nearFraction(coords, lines, freeR, freePts) {
  const { pts, total } = routeSamples(coords);
  if (!total) return 0;
  const CELL = 35;
  const lat0 = toRad(coords[0][0]);
  const dLat = CELL / 111320, dLon = CELL / (111320 * Math.max(0.2, Math.cos(lat0)));
  const grid = new Set();
  for (const line of lines) {
    if (!line || line.length < 2) continue;
    // Feiner abtasten als das Raster grob ist, sonst entstehen Lücken in der Belegung
    for (const q of routeSamples(line, CELL / 2).pts)
      grid.add(Math.floor(q.lat / dLat) + ":" + Math.floor(q.lon / dLon));
  }
  if (!grid.size) return 0;

  let dup = 0, counted = 0;
  for (const p of pts) {
    if (freeR && freePts.some(f => segLen([p.lat, p.lon], f) < freeR)) continue;
    counted += p.w;
    const cy = Math.floor(p.lat / dLat), cx = Math.floor(p.lon / dLon);
    let near = false;
    check:
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (grid.has((cy + dy) + ":" + (cx + dx))) { near = true; break check; }
    if (near) dup += p.w;
  }
  return counted ? dup / counted : 0;
}

/* Auf welcher Seite der Luftlinie liegt die aufgezeichnete Strecke? Der
   Rückweg wölbt sich dann zur Gegenseite – das trifft schneller als blindes
   Ausprobieren beider Seiten. Weiter entfernte Punkte wiegen mehr. */
function sideOfLine(from, to, coords) {
  const brg = bearingTo(from, to);
  let sum = 0;
  for (const c of coords) {
    const d = segLen(from, c);
    if (d < 1) continue;
    const diff = ((bearingTo(from, c) - brg + 540) % 360) - 180;   // −180 … +180
    sum += Math.sign(diff) * d;
  }
  return sum >= 0 ? 1 : -1;                                        // +1 = rechts der Luftlinie
}

/* Zwischenpunkte auf einem Bogen von „from" nach „to": entlang der Luftlinie
   verteilt und senkrecht dazu ausgelenkt, am Scheitel am stärksten. `skew`
   verschiebt diesen Scheitel (0,5 = Mitte) – ein Bogen, der sich früh oder
   spät wölbt, trifft im Wegenetz andere Straßen als der symmetrische. */
function arcWaypoints(from, to, side, bulgeM, n, skew = 0.5) {
  const brg = bearingTo(from, to), d = segLen(from, to);
  const sk = Math.min(0.85, Math.max(0.15, skew));
  const out = [];
  for (let k = 1; k <= n; k++) {
    const t = k / (n + 1);
    const base = destPoint(from[0], from[1], brg, d * t);
    // t auf u abbilden, sodass u = 0,5 (und damit die volle Auslenkung) bei sk liegt
    const u = t < sk ? 0.5 * t / sk : 0.5 + 0.5 * (t - sk) / (1 - sk);
    out.push(destPoint(base[0], base[1], (brg + side * 90 + 360) % 360, Math.sin(Math.PI * u) * bulgeM));
  }
  return out;
}

/* Die Ausweich-Versuche einer Suche: Seite, Auslenkung, Zahl der
   Zwischenpunkte, Lage des Scheitels. Die Stufen laufen von schmal nach weit
   und wechseln dabei die Seite; *innerhalb* einer Stufe wird gewürfelt. Genau
   daran hing, dass „Anderer Rückweg" immer dasselbe lieferte: Ein fester Plan
   stellt bei jedem Druck dieselben Anfragen, und wenn keine davon sauber
   ausweicht, gewinnt jedes Mal derselbe Kandidat. */
function returnPlan(away) {
  const rnd = (a, b) => a + Math.random() * (b - a);
  return [[away, 0.30, 0.55], [-away, 0.30, 0.55], [away, 0.6, 1.0],
          [-away, 0.6, 1.0], [away, 1.1, 1.7], [-away, 1.1, 1.7]]
    .map(([side, lo, hi]) => ({ side, f: rnd(lo, hi),
                                n: Math.random() < 0.5 ? 1 : 2, skew: rnd(0.3, 0.7) }));
}

/* Wie lang darf der Rückweg werden? Der Prozentsatz aus den Einstellungen ist
   auf kurzer Strecke zu knapp: Wer 250 m vom Start entfernt steht, kommt mit
   60 % Umweg nicht einmal um den Block – und dann bleibt eben nur der Hinweg.
   Deshalb gilt zusätzlich ein fester Spielraum von RETURN_EXTRA_M, und jeder
   weitere Vorschlag darf noch großzügiger ausfallen: Ein längerer Rückweg ist
   genau das, was den größeren Bogen überhaupt erst zulässt. */
function returnMaxRatio(baseM, tries) {
  const pct = 1 + Math.max(0, settings.returnDetour) / 100;
  const abs = baseM > 0 ? 1 + RETURN_EXTRA_M / baseM : pct;
  return Math.max(pct, abs) * (1 + RETURN_WIDEN * Math.max(0, tries));
}

/* Gemeinsame Strecke mit dem Hinweg wiegt am schwersten. Fast genauso schwer
   wiegt die Deckung mit einem schon gezeigten Rückweg (`prev`) – sonst kommt
   auf „Anderer Rückweg" wieder derselbe Weg heraus. Der Umweg kostet erst,
   wenn er die erlaubte Grenze reißt. Eine Stichfahrt im Rückweg selbst (self)
   ist ebenfalls unerwünscht, aber halb so schlimm. */
function returnScoreOf(c, maxRatio) {
  return c.shared + (c.prev || 0) * 0.8
       + Math.max(0, c.ratio - maxRatio) * 1.5 + (c.self || 0) * 0.5;
}

async function searchReturn(from, to, profile, onProgress, cancelled) {
  const trackLineCoords = trackCoords();
  const freePts = [from, to];
  const crow = segLen(from, to);
  // Der straffreie Nahbereich muss zur Länge passen. Fest 80 m um Start *und*
  // Ziel decken auf einem 270-m-Rückweg mehr als die halbe Strecke zu – dann
  // meldet die App „0 % gemeinsam", obwohl das letzte Stück sichtbar auf dem
  // Hinweg verläuft, und die Bewertung sieht diese Wiederholung gar nicht.
  const freeR = Math.max(20, Math.min(300, RETURN_FREE_M + track.distance * 0.03, crow * 0.2));
  const tries = returnRoutes.length;
  let requests = 0, best = null;
  // Maßstab für den Umweg ist der kürzeste Rückweg. Der hängt nur an Start,
  // Ziel und Verkehrsmittel – bei „Anderer Rückweg" ihn erneut anzufragen,
  // verschenkt eine von wenigen Anfragen für eine Antwort, die schon bekannt
  // ist. Das Verkehrsmittel gehört mit in den Schlüssel: Wer nach dem ersten
  // Rückweg von Fuß auf Auto stellt, bekommt sonst Umweg-Prozente, die gegen
  // die Fußstrecke gerechnet sind.
  let base = returnBase && returnBase.profile === profile &&
             segLen(returnBase.from, from) < 30 && segLen(returnBase.to, to) < 30
    ? { distance: returnBase.distance } : null;
  let maxRatio = returnMaxRatio(base ? base.distance : crow * 1.3, tries);

  const tryWaypoints = async wps => {
    if (requests >= RETURN_BUDGET || cancelled()) return null;
    requests++;
    onProgress(`<span class="spinner spinner-inline"></span> ${t("progress.return", { n: requests })}`);
    let r;
    try { r = await osrmRoute([from, ...wps, to], profile); } catch { return null; }
    if (cancelled() || !r || r.distance < 50 || (r.avgSnap || 0) > MAX_SNAP_M) return null;
    const cand = { ...r, waypoints: wps, kind: "return",
                   shared: nearFraction(r.coords, [trackLineCoords], freeR, freePts),
                   prev: nearFraction(r.coords, returnRoutes, freeR, freePts),
                   self: overlapFraction(r.coords) };
    // Fällt der direkte Rückweg aus (Router-Fehler), dient eben der nächste
    // Treffer als Maßstab.
    if (!base) { base = cand; maxRatio = returnMaxRatio(base.distance, tries); }
    cand.ratio = cand.distance / Math.max(base.distance, 1);
    if (!best || returnScoreOf(cand, maxRatio) < returnScoreOf(best, maxRatio)) best = cand;
    return cand;
  };
  const goodEnough = c => c && c.ratio <= maxRatio &&
                          c.shared <= RETURN_GOOD_SHARE && c.prev <= RETURN_GOOD_SHARE;
  const done = cand => ({ cand, base, requests, fresh: (cand.prev || 0) < RETURN_SAME });

  // 1. Der direkte Rückweg. Oft schon ein anderer Weg als der Hinweg – dann ist
  //    er auch der kürzeste und die Suche ist hier zu Ende. Beim zweiten Druck
  //    ist er längst vorgeschlagen; dann steht sein Maß im Cache und alle
  //    Anfragen bleiben für die Bögen übrig.
  if (!base) {
    const direct = await tryWaypoints([]);
    if (direct) returnBase = { from, to, profile, distance: direct.distance };
    if (goodEnough(direct)) return done(direct);
  }

  // 2. Sonst über Bögen ausweichen: von schmal nach weit, im Wechsel zur
  //    Gegenseite des Hinwegs und zurück, mit gewürfelter Auslenkung – zwei
  //    Suchläufe fragen damit nicht dieselben Bögen ab.
  const away = -sideOfLine(from, to, trackLineCoords);
  for (const step of returnPlan(away)) {
    if (requests >= RETURN_BUDGET || cancelled()) break;
    await sleep(ITER_DELAY_MS);
    const cand = await tryWaypoints(
      arcWaypoints(from, to, step.side, Math.max(120, crow * step.f), step.n, step.skew));
    if (goodEnough(cand)) return done(cand);
  }

  // 3. Kein einziger Bogen war brauchbar (Router streikt, Wegenetz lässt die
  //    Wunschpunkte nicht zu) und der Maßstab kam aus dem Cache: dann ist der
  //    direkte Weg noch gar nicht angefragt worden. Ihn jetzt zu holen ist
  //    allemal besser als „hier liefert der Router nichts" – die Karte wurde
  //    für die Suche schon geleert.
  if (!best && !cancelled()) {
    const direct = await tryWaypoints([]);
    if (direct) returnBase = { from, to, profile, distance: direct.distance };
  }
  return best ? done(best) : null;
}

function showReturnStatus(route, base, fresh) {
  setStatusLive(() => returnStatusHtml(route, base, fresh));
}

function returnStatusHtml(route, base, fresh) {
  const pct = (v, d = 0) => nfmt(v * 100, d);
  const shareCls = route.shared <= RETURN_GOOD_SHARE ? "ok" : "warn";
  const detour = base && base.distance ? route.distance / base.distance - 1 : 0;
  // Kommt derselbe Weg noch einmal, wird das gesagt – wortlos dieselbe Linie
  // neu zu zeichnen sieht wie ein hängender Knopf aus.
  const note = fresh === false ? t("status.return.same")
    : route.shared > RETURN_GOOD_SHARE ? t("status.return.partly") : "";
  return t("status.return.head") +
    `<span class="ok">${fmtDist(route.distance)}</span> · ${t("status.approx", { dur: fmtDur(route.duration) })}` +
    `${t("status.return.shared")}<span class="${shareCls}">${pct(route.shared)} %</span>` +
    (detour > 0.02 ? t("status.return.detour", { p: pct(detour) }) : "") + note;
}

/* Der eine Knopfdruck: Aufzeichnung beenden, Standort bestimmen, Rückweg suchen,
   anzeigen. Das Ergebnis ist eine ganz normale Route – Höhenprofil, Teilen,
   GPX, Navigation und Speichern funktionieren wie bei einem Rundkurs. */
async function findReturn() {
  if (busy) return;
  if (!trackHasData()) { toast(t("toast.noTrack")); return; }
  if (track.recording) stopRecording();          // angekommen – damit ist der Hinweg fertig
  const coords = trackCoords();
  const to = coords[0];
  // „Wo ich jetzt stehe" schlägt „wo die Aufzeichnung endete" – zwischen beidem
  // können Stunden liegen. Ohne frischen Fix bleibt das Ende der Aufzeichnung.
  const here = livePos && Date.now() - livePos.time < LIVE_FRESH_MS
    ? [livePos.lat, livePos.lng] : coords[coords.length - 1];
  const crow = segLen(here, to);
  if (crow < RETURN_MIN_CROW) {
    setStatusLive(() => t("status.tooClose", { m: Math.round(crow) }));
    return;
  }

  cancelSearch();
  setStart(L.latLng(here[0], here[1]), false, t("marker.returnStart"));
  const token = genToken;
  const cancelled = () => token !== genToken;

  busy = true;
  const backBtn = $("backBtn");
  backBtn.disabled = true; genBtn.disabled = true; variantBtn.disabled = true;
  backBtn.innerHTML = `<span class="spinner"></span>${t("track.back.busy")}`;
  clearRoute();
  routeCtx = { targetM: 0, profile: mode, tol: settings.tolerance / 100, km: 0 };

  try {
    const res = await searchReturn(here, to, mode, msg => { if (!cancelled()) setStatus(msg); }, cancelled);
    if (cancelled()) return;
    if (!res) throw new Error(t("err.noReturn"));
    routeCtx = { targetM: res.cand.distance, profile: mode,
                 tol: settings.tolerance / 100, km: res.cand.distance / 1000 };
    // Der nächste Vorschlag meidet auch diesen – aber nur die jüngsten vier,
    // sonst bleibt nach genug Knopfdrücken gar kein Weg mehr übrig. Ein
    // Vorschlag, der einen früheren bloß wiederholt, kommt nicht mit hinein:
    // er würde einen der vier Plätze für nichts belegen.
    if (res.fresh !== false) returnRoutes = returnRoutes.concat([res.cand.coords]).slice(-4);
    drawRoute(res.cand, { fit: false });
    // Hin- und Rückweg gehören zusammen: beide ins Bild holen
    const bounds = routeLine.getBounds();
    if (trackLine) bounds.extend(trackLine.getBounds());
    focusBounds(bounds);
    variantBtn.disabled = true;                  // Würfeln gehört zum Rundkurs, nicht zum Rückweg
    showReturnStatus(res.cand, res.base, res.fresh);
  } catch (e) {
    if (!cancelled()) setStatus(`<span class="err">${e.message}</span>`);
  } finally {
    busy = false;
    genBtn.disabled = false;
    backBtn.disabled = false;
    renderTrackUI();                             // setzt die Beschriftung des Knopfes zurück
  }
}

/* Setzt den blauen Start-Marker auf den aktuellen Standort. Ist ein frischer
   Live-Fix vorhanden, geht das ohne Wartezeit. */
function locate() {
  if (!navigator.geolocation) { toast(t("toast.noGeoApi")); return; }
  if (livePos && Date.now() - livePos.time < LIVE_FRESH_MS) {
    setStart(L.latLng(livePos.lat, livePos.lng), true);
    return;
  }
  setStatus(t("progress.locating"));
  if (liveBtnEl) liveBtnEl.classList.add("busy");
  navigator.geolocation.getCurrentPosition(
    pos => {
      if (liveBtnEl) liveBtnEl.classList.remove("busy");
      onLivePos(pos, true);
      setStart(L.latLng(pos.coords.latitude, pos.coords.longitude), true);
    },
    err => {
      if (liveBtnEl) liveBtnEl.classList.remove("busy");
      onLiveError(err);
      setStatus("");
      toast(t("toast.locFailed", { err: err.message }));
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

let searchTimer = null;
async function doSearch(q) {
  if (q.length < 3) { searchResults.style.display = "none"; return; }
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=${encodeURIComponent(q)}`,
      { headers: { "Accept-Language": langMeta().geo } });
    const items = await res.json();
    searchResults.innerHTML = "";
    items.forEach(it => {
      const div = document.createElement("div");
      div.textContent = it.display_name;
      div.onclick = () => {
        searchResults.style.display = "none";
        searchInput.value = it.display_name.split(",")[0];
        setStart(L.latLng(+it.lat, +it.lon), true);
      };
      searchResults.appendChild(div);
    });
    searchResults.style.display = items.length ? "block" : "none";
  } catch { /* still */ }
}

/* ---------- Wischen: die ganze Schublade folgt dem Finger ----------
   Auf dem Handy ist das Panel eine Schublade, und eine Schublade zieht man
   irgendwo an, nicht nur am Griff. Gewischt wird deshalb über der ganzen
   Fläche – auch über Knöpfen, Eingabefeldern und dem Höhenprofil.

   Zwei Gesten teilen sich dieselbe Fläche: senkrecht wischen bewegt die
   Schublade, und wo der Inhalt selbst scrollen kann (langes Panel, kleines
   Display), scrollt zuerst er – bis er am Anschlag ist, dann übernimmt wieder
   die Schublade. Welche der beiden es wird, steht nach den ersten Pixeln fest;
   vorher wird nur gemessen, damit ein Tippen ein Tippen bleibt.

   Weil `touch-action:none` den Browser aus beiden Gesten heraushält, scrollt
   dieser Code den Inhalt selbst. Bewegung und Ende hängen am Dokument, nicht
   am Panel: der Finger darf beim Zuziehen über den Kartenrand hinauslaufen. */
const sheetMQ = window.matchMedia("(max-width:640px)");
const SHEET_GRAB = 8;      // ab so vielen Pixeln steht die Richtung fest
const SHEET_SNAP = 56;     // ab hier klappt es um
const SHEET_FLICK = .5;    // px/ms – ein kurzer Schnipser reicht auch ohne Weg

let sheet = null;          // laufende Geste
let sheetMoved = false;    // gewischt, also gilt der folgende Klick nicht

/* Der nächste Behälter, der in diese Richtung noch scrollen kann */
function sheetScroller(target, dy) {
  for (let el = target; el && el !== panelEl; el = el.parentElement) {
    if (!(el instanceof Element)) break;
    const over = getComputedStyle(el).overflowY;
    if (over !== "auto" && over !== "scroll") continue;
    const room = dy < 0 ? el.scrollHeight - el.clientHeight - el.scrollTop : el.scrollTop;
    if (room > 1) return el;
  }
  return null;
}

/* Wie hoch der Inhalt offen ist. Eingeklappt steht das nur im Stylesheet –
   also kurz ohne `collapsed` messen. Sichtbar wird das nicht: gemessen wird
   zwischen zwei Bildern, und währenddessen läuft kein Übergang. */
function bodyOpenHeight() {
  const collapsed = panelEl.classList.contains("collapsed");
  if (collapsed) panelEl.classList.remove("collapsed");
  const h = panelBodyEl.getBoundingClientRect().height;
  if (collapsed) panelEl.classList.add("collapsed");
  return h;
}

/* Ab hier hängt die Schublade am Finger – egal ob von Anfang an oder erst,
   seit der Inhalt am Anschlag ist. */
function sheetStartDrag(y) {
  sheet.mode = "drag";
  sheet.anchor = y;
  panelEl.classList.add("dragging");     // erst den Übergang aus, dann messen
  sheet.open = !panelEl.classList.contains("collapsed");
  sheet.base = bodyOpenHeight();
  elevHoverEnd();                        // der Zeiger im Höhenprofil gehört nicht zum Wischen
}

function sheetDrawHeight(h) {
  panelBodyEl.style.maxHeight = h + "px";
  panelBodyEl.style.opacity = sheet.base ? Math.min(1, h / sheet.base * 1.6) : 1;
  panelBodyEl.style.marginBottom = "0px";
}

function sheetRelease(collapse) {
  panelEl.classList.remove("dragging");
  panelBodyEl.style.maxHeight = panelBodyEl.style.opacity = panelBodyEl.style.marginBottom = "";
  togglePanel(collapse);
}

panelEl.addEventListener("pointerdown", e => {
  if (sheet || !sheetMQ.matches || e.button > 0) return;
  sheetMoved = false;
  sheet = { id: e.pointerId, x0: e.clientX, y0: e.clientY, y: e.clientY,
            t: e.timeStamp, v: 0, target: e.target, mode: null };
});

document.addEventListener("pointermove", e => {
  if (!sheet || e.pointerId !== sheet.id) return;
  const step = e.clientY - sheet.y;
  const dt = Math.max(1, e.timeStamp - sheet.t);
  sheet.v = step / dt * .7 + sheet.v * .3;   // geglättetes Tempo für den Schnipser
  sheet.y = e.clientY; sheet.t = e.timeStamp;

  if (!sheet.mode) {
    // Erst bei deutlich senkrechter Bewegung übernimmt die Geste
    const dy = e.clientY - sheet.y0;
    if (Math.abs(dy) < SHEET_GRAB || Math.abs(dy) <= Math.abs(e.clientX - sheet.x0)) return;
    sheetMoved = true;
    sheet.scroller = sheetScroller(sheet.target, dy);
    if (sheet.scroller) sheet.mode = "scroll";
    else sheetStartDrag(e.clientY);
  }
  if (sheet.mode === "scroll") {
    const box = sheet.scroller;
    const room = step < 0 ? box.scrollHeight - box.clientHeight - box.scrollTop : box.scrollTop;
    // Am Anschlag geht die Geste an die Schublade über – wie beim Vorbild
    if (room > 0) box.scrollTop -= step;
    else sheetStartDrag(e.clientY);
    return;
  }
  e.preventDefault();                        // keine Textauswahl beim Ziehen
  const h = (sheet.open ? sheet.base : 0) - (e.clientY - sheet.anchor);
  sheetDrawHeight(Math.max(0, Math.min(sheet.base, h)));
}, { passive: false });

function sheetEnd(e) {
  if (!sheet || e.pointerId !== sheet.id) return;
  const s = sheet;
  sheet = null;
  if (s.mode !== "drag") return;
  const dy = e.clientY - s.anchor;
  // Wer vor dem Loslassen kurz innehält, hat nicht geschnipst
  const v = e.timeStamp - s.t > 120 ? 0 : s.v;
  // Weit genug gezogen oder kurz geschnipst: umklappen. Sonst zurück.
  const decided = Math.abs(v) > SHEET_FLICK ? v > 0
                : Math.abs(dy) > SHEET_SNAP ? dy > 0
                : !s.open;
  sheetRelease(decided);
  // Der unterdrückte Klick kommt gleich nach dem Loslassen – oder gar nicht.
  setTimeout(() => { sheetMoved = false; }, 400);
}
document.addEventListener("pointerup", sheetEnd);
document.addEventListener("pointercancel", sheetEnd);

/* Nach dem Wischen soll der Knopf unter dem Finger nicht auslösen */
panelEl.addEventListener("click", e => {
  if (!sheetMoved) return;
  sheetMoved = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* Höhe des Panels geändert? Dann den Ausschnitt nachziehen. */
new ResizeObserver(scheduleRefit).observe(panelEl);

/* ---------- Gespeicherte Routen ---------- */
function routesBgOpen() { return $("routesBg").style.display === "flex"; }
$("routesBtn").onclick = () => { renderRoutes(); $("routesBg").style.display = "flex"; };
$("routesClose").onclick = () => $("routesBg").style.display = "none";
$("routesBg").onclick = e => { if (e.target === $("routesBg")) $("routesBg").style.display = "none"; };
$("exportBtn").onclick = exportRoutes;
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (f) importRoutes(f);
  e.target.value = "";      // dieselbe Datei soll erneut wählbar sein
};

/* ---------- Höhenprofil: Zeiger ---------- */
const elevChart = $("elevChart");
elevChart.addEventListener("pointermove", e => {
  if (sheet && sheet.mode) return;        // gerade wird gewischt, nicht gezeigt
  e.preventDefault(); elevHover(e.clientX);
});
elevChart.addEventListener("pointerdown", e => { e.preventDefault(); elevHover(e.clientX); });
elevChart.addEventListener("pointerleave", elevHoverEnd);
elevChart.addEventListener("pointercancel", elevHoverEnd);
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (elevData) renderElevation(elevData.raw); }, 200);
  scheduleRefit();
});

/* ---------- Thema ---------- */
$("themeBtn").onclick = () => {
  settings.theme = isDark() ? "light" : "dark";
  saveSettings();
  applyTheme();
};

searchInput.oninput = e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(e.target.value.trim()), 450); };
document.addEventListener("click", e => { if (!$("searchWrap").contains(e.target)) searchResults.style.display = "none"; });

$("gearBtn").onclick = () => {
  tolInput.value = settings.tolerance;
  mwInput.checked = settings.avoidMotorway;
  detourInput.value = settings.returnDetour;
  themeInput.value = settings.theme || "auto";
  langInput.value = settings.lang || "auto";
  modalBg.style.display = "flex";
};
$("modalCancel").onclick = () => modalBg.style.display = "none";
modalBg.onclick = e => { if (e.target === modalBg) modalBg.style.display = "none"; };
themeInput.onchange = () => { settings.theme = themeInput.value; applyTheme(); };  // sofort sichtbar

/* ---------- Sprache ----------
   Der Wechsel wirkt sofort, wie beim Thema: Ein Menü, das die eigene Sprache
   erst nach „Speichern" zeigt, lässt einen im Dunkeln. Die Liste kommt aus
   LANGS – eine weitere Sprache steht ohne Zutun hier drin. */
function langSelectOptions() {
  const auto = t("settings.lang.auto", { name: (LANGS[detectLang()] || LANGS[BASE_LANG]).label });
  const want = langInput.value || settings.lang || "auto";
  langInput.innerHTML = "";
  const add = (value, label) => {
    const o = document.createElement("option");
    o.value = value; o.textContent = label;
    langInput.appendChild(o);
  };
  add("auto", auto);
  for (const code in LANGS) add(code, LANGS[code].label);
  langInput.value = (want === "auto" || LANGS[want]) ? want : "auto";
}
langInput.onchange = () => setLang(langInput.value, { save: false });
$("modalSave").onclick = () => {
  settings.tolerance = Math.min(50, Math.max(1, parseFloat(tolInput.value) || 5));
  settings.avoidMotorway = mwInput.checked;
  settings.returnDetour = Math.min(300, Math.max(0, parseFloat(detourInput.value) || 0));
  settings.theme = themeInput.value;
  saveSettings();
  applyTheme();
  modalBg.style.display = "none";
  toast(t("settings.toast", { tol: nfmt(settings.tolerance),
                              mw: t(settings.avoidMotorway ? "settings.mw.avoid" : "settings.mw.allow"),
                              detour: nfmt(settings.returnDetour) }));
};

/* ================= Einstiegstour =================
   Beim ersten Öffnen: fünf kurze Schritte auf das, was da ist – abgedunkelt bis
   auf den erklärten Bereich. Varianten und Höhenprofil kommen darin bewusst
   nicht vor: Beim ersten Öffnen gibt es sie noch gar nicht, eine Tour müsste auf
   leere Stellen zeigen. Die erklärt je ein einzelner Hinweis dann, wenn sie zum
   ersten Mal auftauchen.
   Wer über einen geteilten Link kommt, will die Route sehen und keinen Kurs –
   dort startet nichts von allein; die Einstellungen holen es nach. */
const TOUR_KEY = "roundtrip-tour";
const TOUR_VERSION = 1;

/* Schritte tragen Schlüssel, keine Sätze: So spricht die Tour dieselbe Sprache
   wie der Rest – auch wenn sie mitten im ersten Schritt gewechselt wird. */
const TOUR_STEPS = [
  { el: "searchWrap", title: "tour.s1.title", text: "tour.s1.text" },
  { el: "tripRow",    title: "tour.s2.title", text: "tour.s2.text" },
  { el: "genBtn",     title: "tour.s3.title", text: "tour.s3.text" },
  { el: "climbBtn",   title: "tour.s4.title", text: "tour.s4.text" },
  { el: "trackBox",   title: "tour.s5.title", text: "tour.s5.text" }
];

/* Einzelne Hinweise für das, was es erst später zu sehen gibt */
const TOUR_MARKS = {
  variants: { el: "variants", title: "tour.m.variants.title", text: "tour.m.variants.text" },
  elev: { el: "elevBox", title: "tour.m.elev.title", text: "tour.m.elev.text" }
};

function loadTourState() {
  try {
    const t = JSON.parse(localStorage.getItem(TOUR_KEY));
    if (t && t.v === TOUR_VERSION) { t.seen = t.seen || {}; return t; }
  } catch { /* privater Modus */ }
  return { v: TOUR_VERSION, done: false, skipped: false, seen: {} };
}
function saveTourState() {
  try { localStorage.setItem(TOUR_KEY, JSON.stringify(tourState)); } catch { /* privater Modus */ }
}

let tourState = loadTourState();
let tourSteps = null, tourIdx = 0, tourSingle = false, tourQueue = [];
let tourFirstRun = false;      // nur die allererste Tour zeigt die Sprachwahl
let tourQuiet = false;         // geteilter Link: keine Tour, auch keine Einzelhinweise

function tourRun(steps, single) {
  if (!steps || !steps.length || tourSteps) return;
  closeClimbPop();
  togglePanel(false);                       // eingeklappt wäre nichts zu zeigen
  tourSteps = steps; tourIdx = 0; tourSingle = !!single;
  tourRender();
}

function tourRender() {
  const step = tourSteps && tourSteps[tourIdx];
  const el = step && $(step.el);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  const r = el && el.getBoundingClientRect();
  if (!r || !r.width || !r.height) {        // Element nicht sichtbar → Schritt überspringen
    if (tourIdx >= tourSteps.length - 1) return tourEnd();
    tourIdx++; return tourRender();
  }

  const pad = 6, hole = $("tourHole"), bubble = $("tourBubble");
  hole.style.left = (r.left - pad) + "px";
  hole.style.top = (r.top - pad) + "px";
  hole.style.width = (r.width + pad * 2) + "px";
  hole.style.height = (r.height + pad * 2) + "px";

  $("tourTitle").textContent = t(step.title);
  $("tourText").textContent = t(step.text);
  $("tourDots").innerHTML = tourSingle ? "" :
    tourSteps.map((_, i) => `<i class="${i === tourIdx ? "on" : ""}"></i>`).join("");
  $("tourBack").style.display = tourIdx > 0 ? "" : "none";
  $("tourNext").textContent = tourIdx === tourSteps.length - 1
    ? t(tourSingle ? "tour.ok" : "tour.done") : t("tour.next");
  $("tourSkip").style.display = tourSingle ? "none" : "";
  renderTourLang();

  const tour = $("tour");
  tour.classList.add("show");
  tour.setAttribute("aria-hidden", "false");

  // Erst anzeigen, dann messen – sonst hat die Sprechblase keine Höhe.
  const b = bubble.getBoundingClientRect();
  const below = r.bottom + pad + 10;
  bubble.style.top = (below + b.height <= window.innerHeight - 10
    ? below : Math.max(10, r.top - pad - 10 - b.height)) + "px";
  bubble.style.left = Math.min(Math.max(12, r.left + r.width / 2 - b.width / 2),
                               window.innerWidth - b.width - 12) + "px";
  $("tourNext").focus();
}

/* Die Sprachwahl der Tour: sichtbar genau im ersten Schritt der ersten Tour.
   Wer die Einführung aus den Einstellungen erneut aufruft, hat die Sprache
   dort gerade direkt daneben – dann wäre sie hier doppelt. */
function renderTourLang() {
  const box = $("tourLang");
  const show = tourFirstRun && !tourSingle && tourIdx === 0;
  box.hidden = !show;
  if (!show) return;
  $("tourLangLabel").textContent = t("tour.lang");
  const opts = $("tourLangOpts");
  opts.innerHTML = "";
  for (const code in LANGS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tourLangOpt" + (code === lang ? " on" : "");
    b.textContent = LANGS[code].label;
    b.setAttribute("aria-pressed", code === lang ? "true" : "false");
    b.onclick = () => { if (code !== lang) setLang(code); };   // applyLang zeichnet die Tour neu
    opts.appendChild(b);
  }
}

function tourNext() {
  if (!tourSteps) return;
  if (tourIdx >= tourSteps.length - 1) return tourEnd();
  tourIdx++; tourRender();
}
function tourBack() { if (tourSteps && tourIdx > 0) { tourIdx--; tourRender(); } }

function tourEnd(skipped) {
  if (!tourSteps) return;
  const wasTour = !tourSingle;
  tourSteps = null;
  $("tour").classList.remove("show");
  $("tour").setAttribute("aria-hidden", "true");
  if (wasTour) {
    tourState.done = true;
    if (skipped) tourState.skipped = true;
    saveTourState();
  }
  // Was während der Tour aufgelaufen ist, kommt jetzt dran
  const next = tourQueue.shift();
  if (next) setTimeout(() => tourMark(next), 400);
}

/* Ein einzelner Hinweis – höchstens einmal, und nie mitten in der Tour. */
function tourMark(id) {
  const m = TOUR_MARKS[id];
  if (!m || !tourState || tourQuiet || tourState.skipped || tourState.seen[id]) return;
  if (tourSteps) { if (!tourQueue.includes(id)) tourQueue.push(id); return; }
  tourState.seen[id] = true;
  saveTourState();
  tourRun([m], true);
}

$("tourNext").onclick = () => tourNext();
$("tourBack").onclick = () => tourBack();
$("tourSkip").onclick = () => tourEnd(true);
$("tourAgainBtn").onclick = () => {
  modalBg.style.display = "none";
  tourState.skipped = false;
  saveTourState();
  tourFirstRun = false;
  tourRun(TOUR_STEPS);
};
$("tour").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.stopPropagation(); return tourEnd(true); }
  if (e.key === "ArrowRight") return tourNext();
  if (e.key === "ArrowLeft") return tourBack();
  if (e.key !== "Tab") return;
  // Fokusfalle: Der Rest der Seite ist abgedunkelt und soll auch nicht erreichbar sein
  const keys = [...$("tour").querySelectorAll("button")].filter(b => b.offsetParent !== null);
  const i = keys.indexOf(document.activeElement);
  e.preventDefault();
  keys[(i + (e.shiftKey ? -1 : 1) + keys.length) % keys.length].focus();
});
window.addEventListener("resize", () => { if (tourSteps) tourRender(); });

/* Beim Laden: Thema setzen, geteilten Link öffnen, Live-Standort verfolgen
   (ohne Fehler-Toast). Der erste Fix belegt den Startpunkt vor – aber nur,
   wenn nicht ohnehin eine geteilte Route geladen wurde. */
applyLang();                      // beschriftet die Seite, setzt Thema und Knöpfe
const openedShared = loadFromHash();
if (openedShared) liveFirstFix = false;
tourQuiet = !!openedShared;
restoreTrack(!openedShared);      // Verkehrsmittel der Aufzeichnung nur ohne geteilte Route
startLiveTracking();
// Erster Besuch: kurz zeigen, wo was ist – nach einem Moment, damit Karte und
// Panel stehen und die Tour nicht auf einen wandernden Knopf zeigt.
if (!tourQuiet && !tourState.done) {
  tourFirstRun = true;            // erste Tour: Sprachwahl im ersten Schritt
  setTimeout(() => tourRun(TOUR_STEPS), 700);
}
</script>
