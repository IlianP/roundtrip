<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roundtrip – Rundkurs-Planer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#6b7280; --accent:#1d6ef5; --accent-fg:#fff;
    --ok:#16a34a; --warn:#d97706; --err:#dc2626; --border:#e5e7eb; --card-shadow:0 4px 18px rgba(0,0,0,.16);
    --surface-2:#f1f3f6; --toast-bg:#1a1d21; --toast-fg:#ffffff; --overlay:rgba(0,0,0,.4);
    --grid:#e5e7eb; --ghost:#8b93a1; --track:#d9600f; --climb:#4d7a45; --tile-filter:none;
    --radius:14px;
  }
  /* Dunkles Thema: eigene Stufen, keine bloße Umkehrung.
     Greift automatisch (Systemeinstellung) oder manuell über data-theme. */
  @media (prefers-color-scheme:dark){
    html:not([data-theme=light]){
      --bg:#171a1f; --fg:#e8ebef; --muted:#98a1ae; --accent:#5b9dff; --accent-fg:#0d1117;
      --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --border:#2b313a; --card-shadow:0 4px 22px rgba(0,0,0,.5);
      --surface-2:#232830; --toast-bg:#2b313a; --toast-fg:#e8ebef; --overlay:rgba(0,0,0,.55);
      --grid:#2b313a; --ghost:#7b8493; --track:#f5a04a; --climb:#8fbb7e;
      --tile-filter:brightness(.72) saturate(.72) contrast(1.06) hue-rotate(185deg) invert(.92);
    }
  }
  html[data-theme=dark]{
    --bg:#171a1f; --fg:#e8ebef; --muted:#98a1ae; --accent:#5b9dff; --accent-fg:#0d1117;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --border:#2b313a; --card-shadow:0 4px 22px rgba(0,0,0,.5);
    --surface-2:#232830; --toast-bg:#2b313a; --toast-fg:#e8ebef; --overlay:rgba(0,0,0,.55);
    --grid:#2b313a; --ghost:#7b8493; --track:#f5a04a; --climb:#8fbb7e;
    --tile-filter:brightness(.72) saturate(.72) contrast(1.06) hue-rotate(185deg) invert(.92);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg); background:var(--bg);}
  #map{position:fixed; inset:0; z-index:0; background:var(--surface-2);}
  /* Nur die Kacheln abdunkeln – Route, Marker und Bedienelemente bleiben unberührt */
  .leaflet-tile-pane{filter:var(--tile-filter);}
  .leaflet-control-zoom a{background:var(--bg); color:var(--fg); border-color:var(--border);}
  .leaflet-control-zoom a:hover{background:var(--surface-2);}
  .leaflet-control-attribution{background:color-mix(in srgb, var(--bg) 80%, transparent); color:var(--muted);}
  .leaflet-control-attribution a{color:var(--accent);}
  .leaflet-control-scale-line{background:color-mix(in srgb, var(--bg) 75%, transparent); color:var(--fg); border-color:var(--muted);}

  /* ---------- Control panel ---------- */
  .panel{
    position:fixed; z-index:1000; top:12px; left:12px; width:400px; max-width:calc(100vw - 24px);
    background:var(--bg); border-radius:var(--radius); box-shadow:var(--card-shadow);
    padding:14px 16px; display:flex; flex-direction:column; gap:10px;
    container-type:inline-size; container-name:panel;   /* Grundlage der Platz-Abfragen unten */
  }
  .panel h1{font-size:17px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .panel h1 .gear{cursor:pointer; border:none; background:none; font-size:18px; line-height:1; padding:4px; color:inherit;}
  .row{display:flex; gap:8px; align-items:center;}
  label.small{font-size:12px; color:var(--muted);}

  input[type=number], input[type=text]{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:9px; font-size:15px;
    background:var(--bg); color:var(--fg);
  }
  select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:9px; font-size:15px;
    background:var(--bg); color:var(--fg);
  }
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--accent); outline-offset:-1px;}

  /* ---------- Einklappbares Panel ---------- */
  .grabber{display:none;}
  .panel h1 .title{display:flex; align-items:center; gap:6px; cursor:pointer; flex:1; min-width:0;}
  .panel h1 .chev{font-size:12px; color:var(--muted); transition:transform .22s ease;}
  .panel.collapsed .chev{transform:rotate(-90deg);}
  #panelBody{
    display:flex; flex-direction:column; gap:10px;
    overflow:hidden; max-height:75vh; opacity:1;
    transition:max-height .26s ease, opacity .18s ease, margin-bottom .26s ease;
  }
  .panel.collapsed #panelBody{max-height:0; opacity:0; margin-bottom:-10px;}
  /* Während das Panel am Finger hängt, gibt es keinen Übergang: die Höhe kommt
     aus der Geste, eine Animation liefe ihr nur hinterher. */
  .panel.dragging, .panel.dragging #panelBody, .panel.dragging .chev{transition:none;}
  .panel.dragging{user-select:none; -webkit-user-select:none;}

  .seg{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; flex:1;}
  .seg button{
    flex:1; padding:9px 0; border:none; background:var(--bg); font-size:14px; cursor:pointer; color:var(--muted);
    white-space:nowrap;
  }
  .seg button.active{background:var(--accent); color:var(--accent-fg);}

  .btn{
    border:none; border-radius:9px; padding:10px 12px; font-size:15px; cursor:pointer; white-space:nowrap;
    background:var(--surface-2); color:var(--fg); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover{filter:brightness(.96);}
  .btn.primary{background:var(--accent); color:var(--accent-fg); font-weight:600;}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}
  /* Standort und Höhenwunsch sind Beiwerk – die Breite gehört „Route erzeugen“ */
  #locateBtn, #climbBtn{flex:0 0 auto;}

  /* ---------- Enger Platz: Beschriftung weg, Symbol bleibt ----------
     Die Dreierreihe braucht rund 360 px Inhaltsbreite für vollen Text.
     Wird es enger (schmales Handy), sprechen die Symbole für sich; auf
     Tablet und Desktop bleibt die Beschriftung stehen. */
  @container panel (max-width: 366px){
    .btn.iconic .lbl, .seg button .lbl{display:none;}
    .btn.iconic{font-size:18px; padding-left:8px; padding-right:8px;}
    .seg button{font-size:18px; padding:8px 0;}
  }

  /* ---------- Höhenmeter-Wunsch ---------- */
  #climbBtn.set{
    background:color-mix(in srgb, var(--accent) 14%, var(--bg));
    box-shadow:inset 0 0 0 1px var(--accent); font-weight:600;
  }
  /* Angedockt statt Vollbild: eine Dreifach-Wahl braucht kein Abbrechen/Speichern.
     position:fixed, damit dieselbe Rechnung oben im Panel wie unten im Bottom-Sheet stimmt. */
  #climbPop{
    position:fixed; z-index:1200; display:none; flex-direction:column; gap:2px; width:246px;
    background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px;
    box-shadow:var(--card-shadow);
  }
  #climbPop.show{display:flex;}
  #climbPop h3{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:2px;}
  .climbOpt{
    display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%;
    border:1px solid transparent; background:none; border-radius:9px; padding:7px 8px;
    cursor:pointer; font:inherit; font-size:14px; color:var(--fg);
  }
  .climbOpt:hover{background:var(--surface-2);}
  .climbOpt.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--bg));}
  .climbOpt .ico{font-size:16px; line-height:1.3;}
  .climbOpt b{font-weight:600;}
  .climbOpt small{display:block; color:var(--muted); font-size:11.5px; line-height:1.35;}
  #climbPop .hint{
    font-size:11.5px; color:var(--muted); line-height:1.4;
    border-top:1px solid var(--border); padding-top:7px; margin-top:4px;
  }

  #status{font-size:13px; color:var(--muted); min-height:18px; line-height:1.45;}
  #status .ok{color:var(--ok); font-weight:600;}
  #status .warn{color:var(--warn); font-weight:600;}
  #status .err{color:var(--err);}

  #searchWrap{position:relative;}
  #searchResults{
    position:absolute; top:100%; left:0; right:0; background:var(--bg); border:1px solid var(--border);
    border-radius:9px; margin-top:4px; max-height:180px; overflow:auto; z-index:1100; display:none;
  }
  #searchResults div{padding:8px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);}
  #searchResults div:hover{background:var(--surface-2);}

  /* ---------- Varianten-Chips ---------- */
  #variants{display:none; gap:6px; flex-wrap:wrap;}
  #variants.show{display:flex;}
  .vchip{
    border:1px solid var(--border); background:var(--bg); color:var(--muted); cursor:pointer;
    border-radius:999px; padding:5px 11px; font-size:12px; line-height:1.3; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .vchip .dot{width:8px; height:8px; border-radius:50%; background:var(--ghost); flex:none;}
  .vchip .hm{color:var(--climb); font-weight:600;}
  .vchip:hover{background:var(--surface-2);}
  .vchip.active{border-color:var(--accent); color:var(--fg); font-weight:600;}
  .vchip.active .dot{background:var(--accent);}
  .vchip.pending{cursor:default; border-style:dashed;}
  .vchip.pending:hover{background:var(--bg);}

  /* ---------- Aufzeichnung & Rückweg ---------- */
  #trackBox{display:flex; flex-direction:column; gap:8px; padding-top:10px; border-top:1px solid var(--border);}
  #trackHead{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; font-size:12px; color:var(--muted);}
  #trackTitle{font-weight:600; color:var(--fg); display:flex; align-items:center; gap:6px; white-space:nowrap;}
  #trackStats{white-space:nowrap; margin-left:auto;}
  #trackBox .hint{font-size:12px; color:var(--muted); line-height:1.4;}
  #trackBox .hint b{color:var(--fg); font-weight:600;}
  #recBtn.rec{background:var(--err); color:#fff; font-weight:600;}
  .recdot{                                              /* pulsierender Aufnahmepunkt */
    width:9px; height:9px; border-radius:50%; background:var(--err); flex:none;
    animation:recBlink 1.6s ease-in-out infinite;
  }
  @keyframes recBlink{0%,100%{opacity:1;} 50%{opacity:.2;}}
  @media (prefers-reduced-motion:reduce){ .recdot{animation:none;} }

  /* ---------- Höhenprofil ---------- */
  #elevBox{display:none; flex-direction:column; gap:2px;}
  #elevBox.show{display:flex;}
  #elevHead{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--muted);}
  #elevHead b{color:var(--fg); font-weight:600;}
  #elevChart{width:100%; height:78px; display:block; touch-action:none; cursor:crosshair;}
  #elevBox.failed #elevChart, #elevBox.loading #elevChart{display:none;}
  .linkbtn{border:none; background:none; padding:0; font-size:12px; color:var(--accent);
    cursor:pointer; text-decoration:underline;}
  #elevChart .area{fill:var(--accent); opacity:.14;}
  #elevChart .line{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  #elevChart .grid{stroke:var(--grid); stroke-width:1;}
  #elevChart .axis{fill:var(--muted); font-size:9px;}
  #elevChart .cross{stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3;}
  #elevChart .puck{fill:var(--accent); stroke:var(--bg); stroke-width:2;}
  #elevTip{font-size:12px; color:var(--fg); min-height:16px;}

  /* ---------- Settings modal ---------- */
  #modalBg{position:fixed; inset:0; background:var(--overlay); z-index:2000; display:none; align-items:center; justify-content:center;}
  #modal{
    background:var(--bg); border-radius:var(--radius); padding:20px; width:320px; max-width:calc(100vw - 32px);
    display:flex; flex-direction:column; gap:14px; box-shadow:var(--card-shadow);
  }
  #modal h2{font-size:16px;}
  #modal .field{display:flex; flex-direction:column; gap:4px;}
  #modal .hint{font-size:12px; color:var(--muted);}

  /* ---------- Routen-Liste ---------- */
  #routesBg{position:fixed; inset:0; background:var(--overlay); z-index:2000; display:none; align-items:center; justify-content:center;}
  #routesModal{
    background:var(--bg); border-radius:var(--radius); padding:20px; width:420px; max-width:calc(100vw - 32px);
    max-height:80vh; overflow:auto; display:flex; flex-direction:column; gap:10px; box-shadow:var(--card-shadow);
    container-type:inline-size; container-name:routes;
  }
  @container routes (max-width: 330px){ .routeItem .ractions .btn .lbl{display:none;} }
  #routesModal h2{font-size:16px;}
  .routeItem{border:1px solid var(--border); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px;}
  .routeItem .rname{font-weight:600; font-size:14px; word-break:break-word;}
  .routeItem .rmeta{font-size:12px; color:var(--muted);}
  .routeItem .ractions{display:flex; gap:6px; flex-wrap:wrap;}
  .routeItem .ractions .btn{padding:6px 8px; font-size:13px; flex:1; white-space:nowrap;}

  /* ---------- Teilen & Navigation ---------- */
  #shareBg{position:fixed; inset:0; background:var(--overlay); z-index:2000; display:none; align-items:center; justify-content:center;}
  #shareSheet{
    background:var(--bg); border-radius:var(--radius); padding:18px; width:340px; max-width:calc(100vw - 32px);
    display:flex; flex-direction:column; gap:8px; box-shadow:var(--card-shadow);
  }
  #shareSheet h2{font-size:16px; margin-bottom:2px;}
  #shareSheet .btn{justify-content:flex-start; padding:12px 14px;}
  #shareSheet #shClose{justify-content:center; margin-top:2px;}
  #shareSheet .hint{font-size:12px; color:var(--muted);}
  @media (max-width:640px){
    #shareBg{align-items:flex-end;}
    #shareSheet{width:100vw; max-width:100vw; border-radius:16px 16px 0 0; padding-bottom:max(18px, env(safe-area-inset-bottom));}
  }

  /* ---------- Einstiegstour ----------
     Das Loch im Dunkel entsteht ohne zweite Ebene: ein Kasten mit einem
     Schlagschatten, der größer ist als der Bildschirm. Der Kasten selbst
     bleibt durchsichtig, alles ringsum liegt im Schatten. */
  #tour{position:fixed; inset:0; z-index:2500; display:none;}
  #tour.show{display:block;}
  #tourHole{
    position:fixed; border-radius:11px; border:2px solid var(--accent);
    box-shadow:0 0 0 9999px var(--overlay); pointer-events:none;
    transition:top .26s ease, left .26s ease, width .26s ease, height .26s ease;
  }
  #tourBubble{
    position:fixed; width:290px; max-width:calc(100vw - 24px); background:var(--bg);
    border:2px solid var(--accent); border-radius:var(--radius); padding:14px;
    box-shadow:var(--card-shadow); display:flex; flex-direction:column; gap:8px;
    transition:top .26s ease, left .26s ease;
  }
  #tourBubble h3{font-size:15px;}
  /* Sprachwahl über der Überschrift: zwei kleine Pillen, nur im ersten Schritt
     der ersten Tour. Mehr Platz darf eine Nebenfrage nicht bekommen. */
  #tourLang{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
            font-size:12px; color:var(--muted); margin-bottom:2px;}
  #tourLang[hidden]{display:none;}
  #tourLangOpts{display:flex; gap:5px;}
  .tourLangOpt{
    border:1px solid var(--border); background:transparent; color:var(--fg);
    border-radius:999px; padding:3px 9px; font-size:12px; font-family:inherit; cursor:pointer;
  }
  .tourLangOpt.on{border-color:var(--accent); color:var(--accent); font-weight:600;}
  #tourBubble p{font-size:13px; line-height:1.5; color:var(--muted);}
  #tourBubble .btn{padding:7px 12px; font-size:14px; flex:0 0 auto;}
  .tour-nav{display:flex; align-items:center; gap:8px; margin-top:2px;}
  #tourDots{display:flex; gap:5px; margin-right:auto;}
  #tourDots i{width:6px; height:6px; border-radius:50%; background:var(--border); display:block;}
  #tourDots i.on{background:var(--accent);}
  #tourSkip{
    /* 56 px lassen die Zoom-Bedienung rechts oben frei, statt sie zu verdecken */
    position:fixed; top:max(12px, env(safe-area-inset-top)); right:56px; border:none; cursor:pointer;
    background:var(--toast-bg); color:var(--toast-fg); border-radius:999px; padding:6px 14px;
    font-size:13px; font-family:inherit;
  }
  @media (prefers-reduced-motion:reduce){ #tourHole, #tourBubble{transition:none;} }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--toast-bg); color:var(--toast-fg); padding:10px 18px; border-radius:10px; font-size:14px;
    z-index:3000; display:none; max-width:90vw; text-align:center; box-shadow:var(--card-shadow);
  }

  .spinner{
    width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block;
  }
  /* Variante im Statustext: Farbe aus dem Text, damit es in beiden Themen passt */
  .spinner-inline{border-color:color-mix(in srgb, currentColor 25%, transparent); border-top-color:currentColor;
    width:12px; height:12px; vertical-align:-1px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Leaflet-Overlays an das Thema angleichen */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-tooltip{
    background:var(--bg); color:var(--fg); box-shadow:var(--card-shadow);
  }
  .leaflet-tooltip-top::before{border-top-color:var(--bg);}
  .leaflet-tooltip-bottom::before{border-bottom-color:var(--bg);}
  .leaflet-tooltip-left::before{border-left-color:var(--bg);}
  .leaflet-tooltip-right::before{border-right-color:var(--bg);}

  /* ---------- Live-Standort: Karten-Button ---------- */
  .live-btn{
    width:36px; height:36px; padding:0; border:none; border-radius:9px; cursor:pointer;
    background:var(--bg); color:var(--fg); box-shadow:0 1px 5px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .live-btn:hover{background:var(--surface-2);}
  .live-btn.live{color:var(--accent);}                 /* frischer Fix vorhanden */
  .live-btn.busy .icon{animation:spin 1s linear infinite;}
  .live-btn.denied{color:var(--muted); opacity:.6;}

  /* ---------- Live-Standort: blinkender Punkt ---------- */
  .live-icon{pointer-events:none;}                      /* Karten-Klicks gehen durch den Punkt */
  .live-dot{width:16px; height:16px; position:relative;}
  .live-dot::before{                                    /* pulsierender Ring */
    content:""; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px;
    border-radius:50%; background:var(--accent); animation:livePulse 2.2s ease-out infinite;
  }
  .live-dot::after{                                     /* Kern */
    content:""; position:absolute; left:50%; top:50%; width:15px; height:15px; margin:-7.5px 0 0 -7.5px;
    border-radius:50%; background:var(--accent); border:2.5px solid #fff; box-shadow:0 0 4px rgba(0,0,0,.45);
  }
  .live-dot.stale::before{animation:none; opacity:0;}   /* veralteter Fix: Blinken aus, grau */
  .live-dot.stale::after{background:#9aa3af;}
  @keyframes livePulse{
    0%  {transform:scale(1);   opacity:.5;}
    70% {transform:scale(3.6); opacity:0;}
    100%{transform:scale(3.6); opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .live-dot::before{animation:none; opacity:.25; transform:scale(2);}
    .live-btn.busy .icon{animation:none;}
  }

  @media (max-width:640px){
    .panel{
      top:auto; bottom:0; left:0; width:100vw; max-width:100vw; border-radius:16px 16px 0 0;
      padding-top:6px; padding-bottom:max(14px, env(safe-area-inset-bottom));
      /* Senkrechte Gesten gehören der Schublade, nicht dem Browser: das Auf-
         und Zuziehen und das Scrollen des Inhalts macht der Code selbst. */
      touch-action:none;
    }
    .panel #panelBody{max-height:58vh; overflow-y:auto;}
    /* Griff zum Auf- und Zuziehen */
    .grabber{
      display:block; width:42px; height:5px; border-radius:3px; background:var(--border);
      margin:0 auto 6px; flex:none;
    }
    .panel.collapsed{padding-bottom:max(10px, env(safe-area-inset-bottom));}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="panel">
  <div class="grabber" id="grabber"></div>
  <h1>
    <span class="title" id="panelToggle" data-i18n-title="head.collapse">
      🔄 Roundtrip <span class="chev" id="panelChev" aria-hidden="true">▼</span>
    </span>
    <span>
      <button class="gear" id="themeBtn">🌙</button>
      <button class="gear" id="routesBtn" data-i18n-title="head.routes" data-i18n-aria="head.routes">📁</button>
      <button class="gear" id="gearBtn" data-i18n-title="head.settings" data-i18n-aria="head.settings">⚙️</button>
    </span>
  </h1>

  <div id="panelBody">
    <div id="searchWrap">
      <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" autocomplete="off">
      <div id="searchResults"></div>
    </div>

    <div class="row" id="tripRow">
      <div style="flex:1">
        <label class="small" for="distInput" data-i18n="form.dist"></label>
        <input type="number" id="distInput" value="5" min="0.5" max="300" step="0.5">
      </div>
      <div style="flex:1.6">
        <label class="small" data-i18n="form.mode"></label>
        <div class="seg">

/* Die erste vom Browser gewünschte Sprache, die es hier gibt. „de-AT“ zählt
   als „de“; ein ganz unbekannter Wunsch landet bei DEFAULT_LANG. */
function detectLang(prefs) {
  const list = prefs || (navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || ""]);
  for (const p of list) {
    const tag = String(p || "").toLowerCase();
    if (LANGS[tag]) return tag;                 // Platz für regionale Wörterbücher (z. B. "pt-br")
    const base = tag.split("-")[0];
    if (LANGS[base]) return base;
  }
  return DEFAULT_LANG;
}

let lang = LANGS[settings.lang] ? settings.lang : detectLang();

const langLocale = () => (LANGS[lang] || LANGS[BASE_LANG]).locale;
const langMeta = () => LANGS[lang] || LANGS[BASE_LANG];

/* Ein Text. Fehlt der Schlüssel in der gewählten Sprache, greift BASE_LANG –
   und fehlt er auch dort, steht der Schlüssel selbst da: sichtbar, aber nicht
   kaputt. */
function t(key, vars) {
  let s = (STR[lang] && STR[lang][key]);
  if (s === undefined) s = (STR[BASE_LANG] && STR[BASE_LANG][key]);
  if (s === undefined) return key;
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? m : vars[k]));
}

/* Zählbares: der Schlüssel bekommt .one oder .other. Eine Sprache mit mehr
   Formen bringt hier ihre eigene Regel unter, ohne die Aufrufe anzufassen. */
function tn(key, n, vars) {
  return t(`${key}.${n === 1 ? "one" : "other"}`, { n: nfmt(n), ...(vars || {}) });
}

/* Zahlen in der Schreibweise der Sprache (1,5 km gegen 1.5 km) */
function nfmt(n, digits) {
  return Number(n).toLocaleString(langLocale(),
    digits === undefined ? undefined : { maximumFractionDigits: digits });
}

const modeName = m => t(`mode.${MODES[m] ? m : "foot"}.name`);

/* Die Oberfläche neu beschriften. Statische Texte hängen als data-i18n am
   Element, alles Errechnete zieht seine Render-Funktion nach. Das läuft beim
   Start genauso wie nach einem Sprachwechsel – es gibt keinen zweiten Weg,
   auf dem Texte in die Seite kommen. */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("app.title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = t(el.dataset.i18nTitle);
  for (const el of document.querySelectorAll("[data-i18n-aria]"))
    el.setAttribute("aria-label", t(el.dataset.i18nAria));
  for (const el of document.querySelectorAll("[data-i18n-placeholder]"))
    el.placeholder = t(el.dataset.i18nPlaceholder);
  langSelectOptions();
  applyMapLang();
  applyTheme();                 // Titel des Themen-Knopfes
  renderClimbBtn();
  renderTrackUI();
  renderVariantChips();
  redrawStatus();
  if (liveBtnEl && !liveBtnEl.classList.contains("denied")) liveBtnEl.title = t("live.setStart");
  if (liveBtnEl) liveBtnEl.setAttribute("aria-label", t("live.setStart"));
  if (routesBgOpen()) renderRoutes();
  if (elevData) renderElevation(elevData.raw);
  if (tourSteps) tourRender();
}

/* Der Sprachwechsel selbst: „auto“ heißt, weiter dem Browser zu folgen. */
function setLang(next, opts = {}) {
  const chosen = next === "auto" ? null : (LANGS[next] ? next : null);
  settings.lang = chosen;
  lang = chosen || detectLang();
  if (opts.save !== false) saveSettings();
  applyLang();
  if (opts.toast) toast(t("toast.lang", { name: langMeta().label }));
}

/* ================= Karte ================= */
const map = L.map("map", { zoomControl: false }).setView([51.16, 10.45], 6);
L.control.zoom({ position: "topright" }).addTo(map);
const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: t("map.attribution")
}).addTo(map);

/* Leaflet hält die Quellenangabe als fertigen Text – beim Sprachwechsel wird
   die alte ausgetragen und die neue eingetragen. */
let mapAttribution = t("map.attribution");
function applyMapLang() {
  const next = t("map.attribution");
  if (next === mapAttribution || !map.attributionControl) return;
  map.attributionControl.removeAttribution(mapAttribution).addAttribution(next);
  mapAttribution = next;
}
L.control.scale({ imperial: false, maxWidth: 160, position: "bottomright" }).addTo(map);

/* Kleiner Karten-Button (rechts oben, unter dem Zoom): Start auf aktuellen Standort */
const LiveControl = L.Control.extend({
  options: { position: "topright" },
  onAdd() {
    const btn = L.DomUtil.create("button", "live-btn");
    btn.type = "button";
    btn.title = t("live.setStart");
    btn.setAttribute("aria-label", t("live.setStart"));
    btn.innerHTML =
      '<span class="icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>' +
      '<path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></span>';
    L.DomEvent.disableClickPropagation(btn);
    L.DomEvent.on(btn, "click", L.DomEvent.stop);
    L.DomEvent.on(btn, "click", () => locate());
    liveBtnEl = btn;
    return btn;
  }
});
map.addControl(new LiveControl());

map.on("click", e => {
  if (suppressMapClick) { suppressMapClick = false; return; } // galt einer Varianten-Linie
  if (!busy) setStart(e.latlng, true);
});

/* ---------- Was die Karte zeigen soll ----------
   Das Panel liegt über der Karte – auf dem Handy als Schublade unten, sonst
   als Karte oben links. Was es verdeckt, ist kein Platz zum Zeigen. Alles,
   was die App ins Bild holt (Strecke, Pin, Hin- und Rückweg), rechnet deshalb
   nur mit dem freien Rest. So liegt die Strecke auch bei offenem Panel mittig
   im sichtbaren Streifen darüber und nicht zur Hälfte darunter.

   `mapFocus` merkt sich dabei, was gerade gilt; `focusFresh` sagt, ob die
   Karte noch so steht, wie die App sie gestellt hat. Wer selbst geschoben oder
   gezoomt hat, bekommt seinen Ausschnitt nicht mehr von hinten weggezogen. */
let mapFocus = null;        // {bounds} oder {latlng, zoom}
let focusFresh = false;     // Karte steht noch so, wie wir sie gestellt haben
let refitUntil = 0;         // bis dahin sind Kartenbewegungen unsere eigenen

map.on("dragstart", () => { focusFresh = false; });
// Leaflet meldet den Zoom erst im nächsten Bild – auch den eigenen. Deshalb
// zählt hier nicht ein Schalter, sondern ein kurzes Zeitfenster.
map.on("zoomstart", () => { if (performance.now() > refitUntil) focusFresh = false; });

/* Wie viele Pixel das Panel an jeder Kante wegnimmt. Es deckt immer eine Ecke
   ab; welche Kante man ihm zuschlägt, entscheidet die größere Restfläche –
   bei der Schublade unten ist das die Unterkante, bei der Karte oben links im
   eingeklappten Zustand die Oberkante und im ausgeklappten die linke. */
function panelInsets() {
  const size = map.getSize();
  const none = { top: 0, right: 0, bottom: 0, left: 0 };
  const r = panelEl.getBoundingClientRect();
  if (!r.width || !r.height) return none;
  if (r.top >= size.y || r.bottom <= 0 || r.left >= size.x || r.right <= 0) return none;
  const gap = 10;
  const cands = [
    { ...none, left:   r.right + gap },
    { ...none, right:  size.x - r.left + gap },
    { ...none, top:    r.bottom + gap },
    { ...none, bottom: size.y - r.top + gap }
  ];
  const free = c => (size.x - c.left - c.right) * (size.y - c.top - c.bottom);
  const best = cands.reduce((a, b) => free(b) > free(a) ? b : a);
  // Ein Streifen muss übrig bleiben, sonst gäbe es nichts mehr zu zeigen:
  // ein Siebtel der Karte behält sie in jedem Fall.
  const keep = .85;
  return { top: Math.min(best.top, size.y * keep), bottom: Math.min(best.bottom, size.y * keep),
           left: Math.min(best.left, size.x * keep), right: Math.min(best.right, size.x * keep) };
}

/* Ränder für fitBounds: das Panel plus etwas Luft ringsum. Im schmalen
   Streifen über der offenen Schublade wäre der übliche Rand die halbe
   Anzeige – dort fällt er entsprechend kleiner aus. */
function fitPadding(extra = 40) {
  const ins = panelInsets(), size = map.getSize();
  const air = free => Math.max(6, Math.min(extra, Math.max(40, free) * .12));
  const x = air(size.x - ins.left - ins.right), y = air(size.y - ins.top - ins.bottom);
  return { paddingTopLeft: [ins.left + x, ins.top + y],
           paddingBottomRight: [ins.right + x, ins.bottom + y] };
}

/* Mitte des freien Ausschnitts: der Punkt soll dort landen, nicht in der
   Bildmitte – die liegt bei offenem Panel hinter dem Panel. */
function focusCenter(latlng, zoom) {
  const ins = panelInsets();
  const off = L.point((ins.left - ins.right) / 2, (ins.top - ins.bottom) / 2);
  if (!off.x && !off.y) return latlng;
  return map.unproject(map.project(latlng, zoom).subtract(off), zoom);
}

/* Ist schon alles frei zu sehen? Dann bleibt die Karte, wo sie ist. */
function focusVisible() {
  if (!mapFocus) return true;
  const ins = panelInsets(), size = map.getSize(), m = 8;
  const inside = p => p.x >= ins.left + m && p.x <= size.x - ins.right - m &&
                      p.y >= ins.top + m && p.y <= size.y - ins.bottom - m;
  if (mapFocus.bounds) {
    const b = mapFocus.bounds;
    return inside(map.latLngToContainerPoint(b.getNorthWest())) &&
           inside(map.latLngToContainerPoint(b.getSouthEast()));
  }
  return inside(map.latLngToContainerPoint(mapFocus.latlng));
}

function applyFocus(opts = {}) {
  if (!mapFocus) return;
  if (!opts.force && focusVisible()) return;
  const animate = opts.animate !== false;
  refitUntil = performance.now() + 800;
  if (mapFocus.bounds) map.fitBounds(mapFocus.bounds, { ...fitPadding(), animate });
  else {
    const z = mapFocus.zoom || map.getZoom();
    map.setView(focusCenter(mapFocus.latlng, z), z, { animate });
  }
  focusFresh = true;
}

/* Strecke (oder mehrere Linien) ins Bild holen */
function focusBounds(bounds, opts = {}) {
  mapFocus = { bounds };
  applyFocus({ force: true, ...opts });
}

/* Einen Punkt ins Bild holen – oder ihn sich nur merken (`hold`), wenn die
   Karte gerade nicht springen soll, etwa beim Klick auf die Karte. */
function focusPoint(latlng, zoom, opts = {}) {
  mapFocus = { latlng, zoom };
  if (opts.hold) { focusFresh = true; return; }
  applyFocus({ force: true, ...opts });
}

/* Ändert das Panel seine Höhe, rutscht der Ausschnitt nach – sofern die Karte
   noch unverschoben ist, also niemandem sein eigener Ausschnitt weggezogen
   wird. Beim Auf- und Zuklappen wird dabei neu eingepasst (`force`): der
   gewonnene Platz gehört der Strecke, der verlorene darf sie nicht verdecken.
   Bei allem anderen – Höhenprofil kommt dazu, Statuszeile wird zweizeilig –
   rückt die Karte nur, wenn sonst wirklich etwas dahinter läge. */
let refitTimer = null, refitForce = false;
function scheduleRefit(force) {
  refitForce = refitForce || !!force;
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    if (!focusFresh || sheet) return;   // nicht mitten in einer Wischgeste
    const hard = refitForce;
    refitForce = false;
    applyFocus({ animate: true, force: hard });
  }, 140);
}

/* Aktuelle Themenfarbe (hell/dunkel) für Leaflet-Layer, die kein CSS lesen */
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ================= Geometrie-Helfer ================= */
const R_EARTH = 6371008.8;
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;

function destPoint(lat, lon, bearingDeg, distM) {
  const δ = distM / R_EARTH, θ = toRad(bearingDeg);
  const φ1 = toRad(lat), λ1 = toRad(lon);
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
                             Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
  return [toDeg(φ2), ((toDeg(λ2) + 540) % 360) - 180];
}

function segLen(a, b) { // Haversine in Metern
  const dφ = toRad(b[0] - a[0]), dλ = toRad(b[1] - a[1]);
  const s = Math.sin(dφ / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dλ / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(s));
}

/* Länge eines Linienzugs in Metern */
function pathLength(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += segLen(coords[i - 1], coords[i]);
  return d;
}

/* Anfangspeilung von a nach b (0° = Nord), Gegenstück zu destPoint */
function bearingTo(a, b) {
  const φ1 = toRad(a[0]), φ2 = toRad(b[0]), Δλ = toRad(b[1] - a[1]);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* Route in äquidistante Stützpunkte (~40 m) entlang des Verlaufs zerlegen */
function routeSamples(coords, step = 40) {
  const pts = [];
  let pos = 0;
  for (let i = 1; i < coords.length; i++) {
    const a = coords[i - 1], b = coords[i], L = segLen(a, b);
    if (!L) continue;
    const n = Math.max(1, Math.ceil(L / step));
    for (let k = 0; k < n; k++) {
      const t = k / n;
      pts.push({ lat: a[0] + (b[0] - a[0]) * t, lon: a[1] + (b[1] - a[1]) * t,
                 pos: pos + L * t, w: L / n, seg: i - 1 });
    }
    pos += L;
  }
  return { pts, total: pos };
}

/* Nähe-Doppelstrecken-Metrik ("Zipfel"): Anteil der Strecke, der räumlich
   nahe (≤ ~1 Rasterzelle, 75 m) an einem ENTFERNTEN Teil der Route verläuft
   (Streckenabstand > minSep, zirkulär gemessen, da Rundkurs). Erfasst auch
   getrennte Richtungsfahrbahnen (Autobahn!) und parallele Nebenwege.
   Einmaliges Kreuzen der eigenen Route fällt kaum ins Gewicht. */
function overlapAnalysis(coords) {
  // 35-m-Zellen + Nachbarzellen ⇒ erfasst Wiederholungen bis ~70 m Abstand:
  // gleiche Straße & getrennte Richtungsfahrbahnen ja, normale Parallelstraßen nein.
  const CELL = 35;
  const { pts, total } = routeSamples(coords);
  if (!total) return { fraction: 0, samples: [], total: 0 };
  const minSep = Math.max(250, total * 0.05);
  const lat0 = toRad(coords[0][0]);
  const dLat = CELL / 111320, dLon = CELL / (111320 * Math.max(0.2, Math.cos(lat0)));

  const grid = new Map();
  for (const p of pts) {
    const k = Math.floor(p.lat / dLat) + ":" + Math.floor(p.lon / dLon);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(p.pos);
  }

  let dup = 0;
  const samples = [];
  for (const p of pts) {
    const cy = Math.floor(p.lat / dLat), cx = Math.floor(p.lon / dLon);
    let far = false;
    check:
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const arr = grid.get((cy + dy) + ":" + (cx + dx));
      if (!arr) continue;
      for (const q of arr) {
        const d = Math.abs(q - p.pos);
        if (Math.min(d, total - d) > minSep) { far = true; break check; }
      }
    }
    if (far) dup += p.w;
    samples.push({ pos: p.pos, w: p.w, far });
  }
  return { fraction: dup / total, samples, total };
}
function overlapFraction(coords) { return overlapAnalysis(coords).fraction; }

/* Pinch-Detektion: Findet den größten "Zipfel" rein geometrisch — zwei Punkte
   auf der Route, die räumlich nah beieinander liegen (Engstelle/"Hals"),
   deren Streckenabstand aber ein Vielfaches beträgt. Alles dazwischen ist
   ein Zipfel, unabhängig davon, welche Straßen er benutzt. */
function findWorstPinch(coords) {
  const { pts, total } = routeSamples(coords, 60);
  if (!total || pts.length < 10) return null;
  const NECK = Math.max(120, total * 0.004); // max. Halsbreite
  const lat0 = toRad(coords[0][0]);
  const dLat = NECK / 111320, dLon = NECK / (111320 * Math.max(0.2, Math.cos(lat0)));
  const grid = new Map();
  pts.forEach((p, idx) => {
    const k = Math.floor(p.lat / dLat) + ":" + Math.floor(p.lon / dLon);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(idx);
  });
  let best = null;
  for (let a = 0; a < pts.length; a++) {
    const p = pts[a];
    const cy = Math.floor(p.lat / dLat), cx = Math.floor(p.lon / dLon);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const arr = grid.get((cy + dy) + ":" + (cx + dx));
      if (!arr) continue;
      for (const bIdx of arr) {
        if (bIdx <= a) continue;
        const q2 = pts[bIdx];
        const sec = q2.pos - p.pos;                      // Länge des Zipfel-Abschnitts
        if (sec < 400 || sec > total * 0.35) continue;   // zu klein / wäre halbe Route
        const d = segLen([p.lat, p.lon], [q2.lat, q2.lon]);
        if (d > NECK || sec < 5 * d) continue;           // kein enger Hals / kein Stich
        const saving = sec - d;
        if (!best || saving > best.saving) best = { a: p, b: q2, saving };
      }
    }
  }
  return best;
}

/* Lokale Zipfel-Reparatur: ersetzt NUR den Abschnitt zwischen den Halspunkten
   durch eine geroutete Direktverbindung — keine komplette Neuberechnung.
   Wird nur angewendet, solange die Route nicht zu kurz wird und der
   Gesamt-Score sich verbessert. */
async function repairPinches(cand, targetM, profile, tol) {
  const softMin = targetM * (1 - Math.max(tol, 0.10));
  let cur = cand, repaired = 0;
  for (let r = 0; r < 2; r++) {
    const pinch = findWorstPinch(cur.coords);
    if (!pinch || pinch.saving < 500) break;
    if (cur.distance - pinch.saving < softMin) break;    // würde zu kurz werden
    try {
      const back = await osrmRoute([[pinch.a.lat, pinch.a.lon], [pinch.b.lat, pinch.b.lon]], profile);
      const coords = cur.coords.slice(0, pinch.a.seg + 1)
        .concat(back.coords)
        .concat(cur.coords.slice(pinch.b.seg + 1));
      const cut = pinch.b.pos - pinch.a.pos;
      const distance = cur.distance - cut + back.distance;
      const duration = cur.duration * (1 - cut / cur.distance) + back.duration;
      const next = { ...cur, coords, distance, duration,
                     dev: Math.abs(distance - targetM) / targetM,
                     overlap: overlapFraction(coords), q: roundness(coords) };
      const np = findWorstPinch(coords);
      next.spike = np ? np.saving / distance : 0;
      if (scoreOf(next, tol) >= scoreOf(cur, tol)) break;
      next.repaired = (cur.repaired || 0) + 1;
      cur = next; repaired++;
    } catch { break; }
  }
  return repaired ? cur : null;
}

/* Zipfel-Chirurgie: Findet den Wegpunkt, dessen Hin- UND Rückweg überwiegend
   Doppelstrecke ist (typisch: erzwungene Brücken-/Sackgassen-Stichfahrt).
   Liefert den Index in der aktuellen Wegpunkt-Reihenfolge oder -1. */
function spurWaypointIndex(samples, legDist) {
  if (!legDist || legDist.length < 3) return -1;
  const bounds = [0];
  for (const d of legDist) bounds.push(bounds[bounds.length - 1] + d);
  const share = legDist.map((d, i) => {
    if (d <= 0) return 0;
    let dup = 0;
    for (const s of samples) if (s.far && s.pos >= bounds[i] && s.pos < bounds[i + 1]) dup += s.w;
    return Math.min(1, dup / d);
  });
  let best = -1, bestVal = 0.5; // beidseitig mind. 50 % doppelt
  for (let j = 0; j < legDist.length - 1; j++) { // Wegpunkt j liegt zwischen Leg j und j+1
    const v = Math.min(share[j], share[j + 1]);
    if (v > bestVal) { bestVal = v; best = j; }
  }
  return best;
}

/* "Rundheit": isoperimetrischer Quotient Q = 4πA/L² (Kreis = 1).
   Zipfel fügen Länge ohne umschlossene Fläche hinzu → Q sinkt stark,
   unabhängig davon, ob derselbe Weg benutzt wird. */
function roundness(coords) {
  const lat0 = toRad(coords[0][0]);
  let area2 = 0, L = 0;
  for (let i = 1; i < coords.length; i++) {
    const ax = toRad(coords[i - 1][1]) * Math.cos(lat0) * R_EARTH,
          ay = toRad(coords[i - 1][0]) * R_EARTH,
          bx = toRad(coords[i][1]) * Math.cos(lat0) * R_EARTH,
          by = toRad(coords[i][0]) * R_EARTH;
    area2 += ax * by - bx * ay;
    L += segLen(coords[i - 1], coords[i]);
  }
  const area = Math.abs(area2) / 2;
  return L ? (4 * Math.PI * area) / (L * L) : 0;
}

/* Zwischenpunkte auf einem Kreis, auf dem der Start liegt.
   skip: Winkel-Indizes, die ausgelassen werden (Zipfel-Chirurgie). */
function circleWaypoints(startLL, radiusM, seedBearing, n, dir, skip) {
  const center = destPoint(startLL.lat, startLL.lng, seedBearing, radiusM);
  const startAngle = (seedBearing + 180) % 360; // Start, vom Zentrum aus gesehen
  const pts = [], ks = [];
  for (let k = 1; k <= n; k++) {
    if (skip && skip.has(k)) continue;
    const ang = startAngle + dir * (360 * k / (n + 1));
    pts.push(destPoint(center[0], center[1], ang, radiusM));
    ks.push(k);
  }
  return { pts, ks };
}

/* ================= OSRM ================= */
async function osrmRoute(points, profile) {
  const coordStr = points.map(p => `${p[1].toFixed(6)},${p[0].toFixed(6)}`).join(";");
  let lastErr = null;
  for (const base of OSRM[profile]) {
    try {
      // exclude=motorway wird von den freien Servern nicht unterstützt (InvalidValue).
      // Stattdessen: Geschwindigkeits-Annotationen abrufen und Schnellstraßen-Anteil bestrafen.
      const anno = profile === "car" ? "&annotations=speed,distance" : "";
      const res = await fetch(`${base}${coordStr}?overview=full&geometries=geojson&continue_straight=true${anno}`);
      if (!res.ok) { lastErr = `HTTP ${res.status}`; continue; }
      const data = await res.json();
      if (data.code !== "Ok" || !data.routes?.length) { lastErr = data.code; continue; }
      const r = data.routes[0];
      // Snap-Distanz: wie weit liegen die Wunschpunkte von der nächsten Straße?
      const snaps = (data.waypoints || []).map(w => w.distance || 0);
      const avgSnap = snaps.length ? snaps.reduce((a, b) => a + b, 0) / snaps.length : 0;
      // Schnellstraßen-Anteil (Autobahn/Kraftfahrstraße ≈ Segmente ≥ 22 m/s ≈ 80 km/h)
      let fastFrac = 0;
      if (r.legs) {
        let fast = 0, tot = 0;
        for (const leg of r.legs) {
          const sp = leg.annotation?.speed || [], di = leg.annotation?.distance || [];
          for (let i = 0; i < di.length; i++) { tot += di[i]; if (sp[i] >= 22) fast += di[i]; }
        }
        fastFrac = tot ? fast / tot : 0;
      }
      return { distance: r.distance, duration: r.duration, avgSnap, fastFrac,
               legDist: (r.legs || []).map(l => l.distance),
               coords: r.geometry.coordinates.map(c => [c[1], c[0]]) };
    } catch (e) { lastErr = e.message; }
  }
  throw new Error(t("err.routing", { err: lastErr }));
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= Gelände-Vorabscan (Höhenmeter-Wunsch) =================
   Höhen sind in Roundtrip kein Teil des Routings: OSRM liefert die Straße, die
   Höhe kommt hinterher aus einer zweiten Anfrage an Open-Meteo. Ein Wunsch nach
   mehr oder weniger Höhenmetern müsste also für jeden Kandidaten eine eigene
   Höhen-Anfrage stellen – bei bis zu REQUEST_BUDGET Routing-Anfragen pro
   Erzeugung wäre das dem freien Dienst gegenüber unanständig und würde jede
   Runde spürbar verlangsamen.

   Der Ausweg: Die 100 Punkte einer Höhen-Anfrage müssen nicht auf einer Route
   liegen. Eine einzige Anfrage tastet stattdessen das Gelände um den Start ab
   (CLIMB_RINGS Ringe × CLIMB_DIRS Richtungen). Daraus lässt sich jeder Kandidat
   rein rechnerisch schätzen – ohne eine weitere Anfrage.

   Die Schätzung ist bewusst grob (90-m-Raster, interpoliert) und wird nie als
   Zahl angezeigt; sie ordnet Kandidaten nur untereinander. Angezeigt werden
   ausschließlich die echten Höhenmeter aus dem Höhenprofil der fertigen Route. */

const wantsClimb = () => settings.climbWish === "flat" || settings.climbWish === "hill";

/* Eine Anfrage, ein Raster. Gecacht über Start und Radius, damit „🎲 Würfeln"
   und jede weitere Variante denselben Scan benutzen. */
async function scanTerrain(startLL, radiusM) {
  const key = `${startLL.lat.toFixed(3)},${startLL.lng.toFixed(3)},${Math.round(radiusM / 250)}`;
  if (terrain && terrain.key === key) return terrain;

  const lat0 = startLL.lat, lon0 = startLL.lng;
  const pts = [[lat0, lon0]];
  for (const f of CLIMB_RINGS)
    for (let k = 0; k < CLIMB_DIRS; k++)
      pts.push(destPoint(lat0, lon0, k * 360 / CLIMB_DIRS, radiusM * f));

  const data = await fetchElev(`${ELEV_API}?latitude=${pts.map(p => p[0].toFixed(5)).join(",")}` +
                               `&longitude=${pts.map(p => p[1].toFixed(5)).join(",")}`);
  if (!data || !Array.isArray(data.elevation)) throw new Error("keine Höhendaten");

  // Lokale Meter-Ebene: In dieser Größenordnung reicht die einfache Näherung,
  // und sie spart pro Abtastpunkt eine Haversine-Rechnung.
  const mPerLat = 110574, mPerLon = 111320 * Math.cos(toRad(lat0));
  const samples = [];
  pts.forEach((p, i) => {
    const e = data.elevation[i];
    if (e === null || e === undefined || isNaN(e)) return;
    samples.push({ x: (p[1] - lon0) * mPerLon, y: (p[0] - lat0) * mPerLat, e });
  });
  if (samples.length < CLIMB_DIRS) throw new Error("keine Höhendaten");

  const terr = { key, lat0, lon0, mPerLat, mPerLon, samples, radiusM };

  /* Wie bergig wäre eine Schleife in Richtung b? Die Frage lässt sich ohne
     Routing beantworten: die gedachte Kreis-Schleife durchs Raster schicken.
     Das liefert die Reihenfolge der Suchrichtungen und zugleich die Spanne,
     an der ein echter Kandidat später gemessen wird. */
  terr.dirs = [];
  for (let k = 0; k < CLIMB_DIRS; k++) {
    const b = k * 360 / CLIMB_DIRS;
    terr.dirs.push(estimateClimb(loopProbe(startLL, radiusM, b), terr) ?? 0);
  }
  terr.lo = Math.min(...terr.dirs);
  terr.hi = Math.max(...terr.dirs);
  terr.flat = terr.hi - terr.lo < CLIMB_FLAT_SPAN;   // Gegend gibt keine Wahl her
  return (terrain = terr);
}

/* Grobe Schleifen-Geometrie in einer Richtung – dieselbe Kreisidee wie
   circleWaypoints, nur ohne Router und mit mehr Stützpunkten. */
function loopProbe(startLL, radiusM, bearing) {
  const center = destPoint(startLL.lat, startLL.lng, bearing, radiusM);
  const startAngle = (bearing + 180) % 360;
  const pts = [];
  for (let k = 0; k <= CLIMB_PROBE_PTS; k++)
    pts.push(destPoint(center[0], center[1], startAngle + k * 360 / CLIMB_PROBE_PTS, radiusM));
  return pts;
}

/* Höhe an einer beliebigen Stelle: inverse Distanzgewichtung über die vier
   nächsten Rasterpunkte. Glatt genug, dass die Summe der Anstiege nicht vom
   Rauschen lebt, und lokal genug, dass ein Hügel nicht wegmittelt. */
function elevAt(terr, lat, lon) {
  const x = (lon - terr.lon0) * terr.mPerLon, y = (lat - terr.lat0) * terr.mPerLat;
  const near = [];
  for (const s of terr.samples) {
    const d2 = (s.x - x) ** 2 + (s.y - y) ** 2;
    if (near.length < 4) { near.push({ d2, e: s.e }); near.sort((a, b) => a.d2 - b.d2); }
    else if (d2 < near[3].d2) { near[3] = { d2, e: s.e }; near.sort((a, b) => a.d2 - b.d2); }
  }
  let sw = 0, se = 0;
  for (const n of near) {
    if (n.d2 < 1) return n.e;                       // praktisch auf einem Rasterpunkt
    const w = 1 / n.d2;
    sw += w; se += w * n.e;
  }
  return sw ? se / sw : 0;
}

/* Geschätzte Höhenmeter je Kilometer eines Linienzugs – reine Rechnung im
   Raster, keine Anfrage. Keine Hysterese nötig: das interpolierte Feld ist
   schon glatt, anders als die rohen Messwerte im Höhenprofil. */
function estimateClimb(coords, terr) {
  if (!terr || !coords || coords.length < 2) return null;
  const { pts, total } = routeSamples(coords, CLIMB_STEP_M);
  if (!total) return 0;
  let asc = 0, prev = null;
  for (const p of pts) {
    const e = elevAt(terr, p.lat, p.lon);
    if (prev !== null && e > prev) asc += e - prev;
    prev = e;
  }
  return asc / (total / 1000);
}

/* Strafe für einen Kandidaten, der nicht zum Wunsch passt: 0 für den
   flachsten (bzw. bergigsten) Vorschlag, den die Gegend hergibt, CLIMB_WEIGHT
   für den gegenteiligen. Gibt das Gelände nichts her, kostet nichts. */
function climbPenalty(hmPerKm, terr, wish) {
  if (!terr || terr.flat || hmPerKm == null) return 0;
  if (wish !== "flat" && wish !== "hill") return 0;
  const t = Math.min(1, Math.max(0, (hmPerKm - terr.lo) / (terr.hi - terr.lo)));
  return CLIMB_WEIGHT * (wish === "flat" ? t : 1 - t);
}

/* Geschätzte Höhenmeter einer gedachten Schleife in dieser Richtung */
function dirClimbAt(terr, bearing) {
  const k = Math.round(((bearing % 360) + 360) % 360 / (360 / CLIMB_DIRS)) % CLIMB_DIRS;
  return terr.dirs[k];
}

/* ================= Roundtrip-Algorithmus =================
   Idee: Zwischenpunkte auf einem Kreis (Umfang ≈ Zieldistanz) platzieren,
   reale Route rechnen, Radius proportional zur Abweichung skalieren.
   Jede berechnete Route wird als Kandidat gesammelt und zusätzlich nach
   ihrem Überlappungsanteil (doppelt befahrene Segmente = "Zipfel") bewertet.
   Am Ende gewinnt der Kandidat mit dem besten kombinierten Score:
   Toleranz-Verletzung wiegt schwer, danach entscheidet der Zipfel-Anteil. */
/* Zipfel zählen mehr als Distanz-Genauigkeit: Bis zur weichen Grenze
   (~10 % bzw. Toleranz, falls größer) kostet Abweichung fast nichts,
   darüber wird sie teuer. */
function scoreOf(cand, tol) {
  const softCap = Math.max(tol, 0.10);
  let devPen = 0;
  if (cand.dev > tol)     devPen += (Math.min(cand.dev, softCap) - tol) * 0.5;
  if (cand.dev > softCap) devPen += (cand.dev - softCap) * 5;
  const roundPen = Math.max(0, 0.6 - (cand.q || 0)) * 0.5; // unrunde Formen bestrafen
  return cand.overlap + roundPen + devPen + (cand.fastPen || 0) + (cand.spike || 0) +
         (cand.climbPen || 0);
}

/* Dynamische Wegpunktzahl je Variante. avgSnap = mittlere Entfernung der
   Wunschpunkte zur nächsten Straße → groß = ländlich/dünnes Netz.
   Ländlich: weniger Punkte (mehr Freiheit für den Router, weniger
   erzwungene Stichwege). Städtisch: mehr Punkte (rundere Schleifen). */
function waypointPlan(profile, avgSnap) {
  const rural = avgSnap > 150;
  if (profile === "car")  return rural ? [4, 3, 5, 4, 6] : [5, 6, 7, 5, 4];
  // Rad liegt dazwischen: größere Schleifen als zu Fuß, aber feineres Wegenetz als Auto
  if (profile === "bike") return rural ? [4, 3, 5, 4, 3] : [5, 6, 4, 5, 6];
  return rural ? [3, 4, 5, 3, 4] : [4, 5, 6, 4, 3];
}

/* Eine Richtung absuchen: Wegpunkte auf den Kreis setzen, Route rechnen,
   Radius nachziehen, Zipfel-Wegpunkte amputieren. Liefert den besten
   Kandidaten dieser Richtung samt Angabe, ob er sauber genug ist. */
async function searchSeed(ctx, s) {
  const { startLL, targetM, profile, tol } = ctx;
  const seed = lastSeed = {
    bearing: ctx.bearings[s % ctx.bearings.length],
    dir: s % 2 ? -1 : 1
  };
  let radius = targetM / (2 * Math.PI);
  let failures = 0;
  const skip = new Set();      // amputierte Wegpunkt-Winkel dieser Richtung
  let best = null, clean = false;

  for (let i = 0; i < MAX_ITER; i++) {
    if (ctx.requests >= REQUEST_BUDGET || ctx.cancelled()) break;
    const nWp = ctx.plan ? ctx.plan[s % ctx.plan.length] : (profile === "car" ? 5 : 4);
    ctx.onProgress(t("progress.seeds", { s: s + 1, i: i + 1 }));
    const { pts: wps, ks } = circleWaypoints(startLL, radius, seed.bearing, nWp, seed.dir, skip);
    if (wps.length < 2) break;
    let route;
    try {
      ctx.requests++;
      route = await osrmRoute([[startLL.lat, startLL.lng], ...wps, [startLL.lat, startLL.lng]], profile);
    } catch (e) {
      if (++failures >= 2) break;        // Gebiet vermutlich unroutbar → neue Richtung
      radius *= 0.7; continue;           // z. B. Wasser: Kreis verkleinern
    }
    if (ctx.cancelled()) break;
    // Unsinnige Antwort verwerfen: liegt der Start z. B. im Wasser, schnappt der
    // Router alle Punkte auf denselben weit entfernten Knoten und liefert eine
    // Strecke von 0 m – das ist kein Rundkurs, sondern ein unroutbares Gebiet.
    if (route.distance < 100 || (route.avgSnap || 0) > MAX_SNAP_M) {
      if (++failures >= 2) break;
      radius *= 0.7; continue;
    }
    if (!ctx.plan) ctx.plan = waypointPlan(profile, route.avgSnap || 0);
    const dev = Math.abs(route.distance - targetM) / targetM;
    const analysis = overlapAnalysis(route.coords);
    const overlap = analysis.fraction;
    const q = roundness(route.coords);
    const fastPen = (profile === "car" && settings.avoidMotorway) ? route.fastFrac * 0.6 : 0;
    const pinch = findWorstPinch(route.coords);
    const spike = pinch ? pinch.saving / route.distance : 0;
    const climb = estimateClimb(route.coords, ctx.terrain);
    const climbPen = climbPenalty(climb, ctx.terrain, ctx.wish);
    const cand = { ...route, dev, overlap, q, fastPen, spike, climb, climbPen,
                   waypoints: wps, seedIdx: s };
    if (!best || scoreOf(cand, tol) < scoreOf(best, tol)) best = cand;

    // Zipfel-Chirurgie: Wegpunkt auslassen, der eine Stichfahrt erzwingt —
    // erkannt über Doppelstrecken-Legs ODER über die Pinch-Geometrie
    // (Wegpunkt liegt im Zipfel-Abschnitt zwischen den Halspunkten).
    // Die Radius-Anpassung gleicht die fehlende Länge danach automatisch aus.
    let operated = false;
    if (skip.size < 2) {
      let bad = -1;
      if (overlap > GOOD_OVERLAP) bad = spurWaypointIndex(analysis.samples, route.legDist);
      if (bad < 0 && spike > 0.02 && pinch && route.legDist?.length > 2) {
        const bounds = [0];
        for (const d of route.legDist) bounds.push(bounds[bounds.length - 1] + d);
        for (let j = 0; j < route.legDist.length - 1; j++) {
          if (bounds[j + 1] > pinch.a.pos && bounds[j + 1] < pinch.b.pos) { bad = j; break; }
        }
      }
      if (bad >= 0) { skip.add(ks[bad]); operated = true; }
    }

    if (dev <= tol && !operated) {
      // Distanz passt – zusätzlich praktisch zipfelfrei, rund und ohne Schnellstraße?
      clean = overlap <= GOOD_OVERLAP && q >= MIN_ROUNDNESS && fastPen <= 0.05 && spike <= 0.02;
      break;
    }
    // Radius proportional anpassen (gedämpft)
    radius *= Math.max(0.4, Math.min(2.5, targetM / route.distance));
    await sleep(ITER_DELAY_MS);
  }
  return best ? { cand: best, clean } : null;
}

/* Erste Phase: nur so lange suchen, bis eine brauchbare Route dasteht –
   die wird sofort angezeigt. Weitere Richtungen sucht collectVariants()
   danach im Hintergrund ab, ohne die Bedienung zu blockieren. */
async function makeRoundTrip(startLL, targetM, profile, onProgress, cancelled) {
  const tol = settings.tolerance / 100;
  const softCap = Math.max(tol, 0.10);
  // Richtungen gleichmäßig über 360° verteilen (statt rein zufällig) —
  // so liegt garantiert eine Variante z. B. ganz abseits eines Flusses.
  const ctx = { startLL, targetM, profile, tol, onProgress, cancelled,
                requests: 0, plan: null, baseBearing: Math.random() * 360,
                wish: settings.climbWish, terrain: null, terrainFailed: false };
  ctx.bearings = [];
  for (let s = 0; s < MAX_SEEDS; s++) ctx.bearings.push((ctx.baseBearing + s * 360 / MAX_SEEDS) % 360);

  // Höhenmeter-Wunsch: eine Anfrage fürs Gelände, danach die Suchrichtungen
  // danach sortieren. Die Abdeckung über 360° bleibt – nur die Reihenfolge
  // ändert sich, und die erste gefundene Route ist die angezeigte.
  if (wantsClimb()) {
    onProgress(t("progress.terrain"));
    try {
      ctx.terrain = await scanTerrain(startLL, targetM / (2 * Math.PI));
      const sign = ctx.wish === "flat" ? 1 : -1;
      ctx.bearings.sort((a, b) => sign * (dirClimbAt(ctx.terrain, a) - dirClimbAt(ctx.terrain, b)));
    } catch { ctx.terrainFailed = true; }             // Wunsch verfällt, Suche läuft normal weiter
    if (cancelled()) return null;
  }

  let best = null, s = 0;
  for (; s < MAX_SEEDS; s++) {
    if (ctx.requests >= REQUEST_BUDGET || cancelled()) break;
    const r = await searchSeed(ctx, s);
    if (cancelled()) return null;
    if (r && (!best || scoreOf(r.cand, tol) < scoreOf(best, tol))) best = r.cand;
    // Gut genug – nicht länger warten lassen. Mit Höhen-Wunsch gilt das nur,
    // wenn die Route auch dazu passt: die Schätzung kann danebenliegen, dann
    // bekommt die zweitbeste Richtung noch eine Chance.
    if (r && r.cand.dev <= softCap && (r.cand.climbPen || 0) <= CLIMB_WEIGHT * 0.6) { s++; break; }
  }
  if (!best) return null;
  return { cand: await polish(best, startLL, targetM, profile, tol), ctx, nextSeed: s };
}

/* Zweite Phase: läuft im Hintergrund weiter und meldet jede zusätzliche,
   deutlich andere Route per Rückruf. Der Fortschritt landet bewusst nicht
   in der Statuszeile – dort steht das Ergebnis, das schon nutzbar ist. */
async function collectVariants(ctx, fromSeed, onVariant) {
  ctx.onProgress = () => {};
  for (let s = fromSeed; s < MAX_SEEDS; s++) {
    if (ctx.requests >= REQUEST_BUDGET || ctx.cancelled()) return;
    const r = await searchSeed(ctx, s);
    if (ctx.cancelled()) return;
    if (r && isDistinctVariant(r.cand, ctx.tol) && onVariant(r.cand) >= MAX_VARIANTS) return;
  }
}

/* Zwei Vorschläge sind nur dann zwei, wenn sie räumlich auseinanderliegen –
   und ein deutlich schlechterer Kandidat wird gar nicht erst angeboten. */
function isDistinctVariant(cand, tol) {
  if (!variants.length) return true;
  const minSep = (routeCtx.targetM / (2 * Math.PI)) * 0.6;   // grob ein halber Schleifenradius
  const ctr = centroidOf(cand);
  if (variants.some(v => segLen(centroidOf(v), ctr) < minSep)) return false;
  return scoreOf(cand, tol) <= scoreOf(variants[0], tol) + 0.35;
}

/* Schwerpunkt einer Route – dient dem Vergleich, ob zwei Kandidaten
   tatsächlich in verschiedene Richtungen führen. */
function centroidOf(cand) {
  if (cand._ctr) return cand._ctr;
  let lat = 0, lon = 0;
  for (const c of cand.coords) { lat += c[0]; lon += c[1]; }
  return (cand._ctr = [lat / cand.coords.length, lon / cand.coords.length]);
}

/* Nachbearbeitung: Zipfel reparieren und ggf. die Schleife früher schließen. */
async function polish(cand, startLL, targetM, profile, tol) {
  if (cand.polished) return cand;
  let best = (await repairPinches(cand, targetM, profile, tol)) || cand;
  best = (await closeLoopEarly(best, startLL, targetM, profile, tol)) || best;
  // Geometrie hat sich geändert → Höhenprofil neu holen, Schwerpunkt und
  // gemerkte Höhenmeter verwerfen
  return { ...best, polished: true, elev: null, _ctr: null, _asc: null };
}

/* "Schleife früher schließen": Ist die beste Route zu lang, suche einen Punkt
   auf der Route nahe dem Start, kappe dort und route direkt zurück zum Start.
   Der Rundkurs bleibt geschlossen, wird aber kürzer. */
async function closeLoopEarly(cand, startLL, targetM, profile, tol) {
  if (cand.distance <= targetM * (1 + tol)) return null;
  const c = cand.coords, startPt = [startLL.lat, startLL.lng];
  const cum = [0];
  for (let i = 1; i < c.length; i++) cum.push(cum[i - 1] + segLen(c[i - 1], c[i]));
  const total = cum[cum.length - 1];

  // Kandidaten-Schnittpunkt: ab der zweiten Routenhälfte, Rückweg-Schätzung
  // (Luftlinie × 1,3) soll die Gesamtlänge möglichst nah ans Ziel bringen.
  let bestI = -1, bestErr = Math.abs(cand.distance - targetM);
  for (let i = Math.floor(c.length * 0.5); i < c.length - 2; i++) {
    const direct = segLen(c[i], startPt);
    if (direct > total - cum[i]) continue;          // Rückweg länger als Reststrecke
    const err = Math.abs(cum[i] + direct * 1.3 - targetM);
    if (err < bestErr) { bestErr = err; bestI = i; }
  }
  if (bestI < 0) return null;

  try {
    const back = await osrmRoute([c[bestI], startPt], profile);
    const coords = c.slice(0, bestI + 1).concat(back.coords);
    const distance = cum[bestI] + back.distance;
    if (Math.abs(distance - targetM) >= Math.abs(cand.distance - targetM)) return null;
    const overlap = overlapFraction(coords);
    if (overlap > cand.overlap + 0.03) return null; // Kürzung darf keine neuen Zipfel kosten
    const duration = cand.duration * (cum[bestI] / total) + back.duration;
    return { ...cand, coords, distance, duration, overlap, q: roundness(coords),
             dev: Math.abs(distance - targetM) / targetM, trimmed: true };
  } catch { return null; }
}

/* ================= UI-Aktionen ================= */
function setStart(latlng, pan, label) {
  cancelSearch();          // laufende Suche gehört zum alten Startpunkt
  start = latlng;
  if (startMarker) startMarker.remove();
  startMarker = L.marker(latlng, { title: label || t("marker.start") }).addTo(map)
    .bindPopup(label || t("marker.startPopup")).openPopup();
  // Der Pin gehört ins Freie: beim Setzen dorthin, beim Klick auf die Karte
  // bleibt die Karte stehen – gemerkt wird er trotzdem, damit er beim
  // Aufklappen des Panels nicht dahinter verschwindet.
  focusPoint(latlng, pan ? Math.max(map.getZoom(), 14) : map.getZoom(), { hold: !pan });
  setStatusLive(() => t("status.startSet"));
}

function clearGhosts() { ghostLines.forEach(l => l.remove()); ghostLines = []; }

function clearRoute(keepVariants) {
  if (routeLine) { routeLine.remove(); routeLine = null; }
  wpMarkers.forEach(m => m.remove()); wpMarkers = [];
  clearGhosts();
  lastRoute = null;
  if (!keepVariants) { variants = []; activeVariant = 0; renderVariantChips(); }
  hideElevation();
  shareBtn.disabled = true; variantBtn.disabled = true; saveBtn.disabled = true;
}

function drawRoute(route, opts = {}) {
  clearRoute(true);
  routeLine = L.polyline(route.coords, { color: cssVar("--accent"), weight: 5, opacity: .85 }).addTo(map);
  (route.waypoints || []).forEach(p => {
    wpMarkers.push(L.circleMarker(p, { radius: 5, color: cssVar("--bg"), weight: 2,
                                       fillColor: cssVar("--accent"), fillOpacity: 1 }).addTo(map));
  });
  drawGhosts();
  renderVariantChips();
  if (opts.fit !== false) focusBounds(routeLine.getBounds());
  lastRoute = route;
  shareBtn.disabled = false; variantBtn.disabled = false; saveBtn.disabled = false;
  if (opts.elevation !== false) loadElevation(route);
}

/* ---------- Varianten: drei unterschiedliche Vorschläge zur Auswahl ---------- */
function drawGhosts() {
  clearGhosts();
  const ghost = cssVar("--ghost");
  variants.forEach((v, i) => {
    if (i === activeVariant) return;
    const line = L.polyline(v.coords, { color: ghost, weight: 3, opacity: .7,
                                        dashArray: "6 7", interactive: false }).addTo(map);
    // Breite, fast durchsichtige Linie darüber: bequemes Ziel für den Finger
    const hit = L.polyline(v.coords, { color: ghost, weight: 14, opacity: .12 }).addTo(map);
    hit.bindTooltip(t("variant.chip", { n: i + 1, dist: fmtDist(v.distance) }), { sticky: true });
    hit.on("click", () => {
      suppressMapClick = true;
      setTimeout(() => { suppressMapClick = false; }, 0);
      activateVariant(i);
    });
    ghostLines.push(line, hit);
  });
}

function renderVariantChips() {
  const box = $("variants");
  box.innerHTML = "";
  if (variants.length < 2 && !(searching && variants.length)) { box.classList.remove("show"); return; }
  const pick = bestClimbVariant();
  variants.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "vchip" + (i === activeVariant ? " active" : "");
    b.type = "button";
    b.innerHTML = '<span class="dot"></span>';
    b.appendChild(document.createTextNode(t("variant.chip", { n: i + 1, dist: fmtDist(v.distance) })));
    const asc = climbOf(v);
    if (asc != null) {
      const hm = document.createElement("span");
      hm.className = "hm";
      hm.textContent = " · " + t("unit.climb", { n: asc }) + (i === pick ? ` ${climbUi(routeCtx.wish).icon}` : "");
      b.appendChild(hm);
    }
    b.title = t("variant.title", { dev: nfmt((v.dev || 0) * 100, 1), ov: nfmt((v.overlap || 0) * 100, 1) }) +
              (i === pick ? t("variant.best", { name: climbUi(routeCtx.wish).name }) : "");
    b.onclick = () => activateVariant(i);
    box.appendChild(b);
  });
  if (searching) {
    const p = document.createElement("span");
    p.className = "vchip pending";
    p.innerHTML = '<span class="spinner spinner-inline"></span>';
    p.appendChild(document.createTextNode(t("variant.more")));
    box.appendChild(p);
  }
  box.classList.add("show");
}

/* Welcher Vorschlag trifft den Höhen-Wunsch wirklich? Die Suche steuert nur
   über die grobe Rasterschätzung; sobald alle Varianten ihr echtes Profil
   haben, weiß die App es genau – und markiert den passenden Chip, statt die
   angezeigte Route unter der Hand auszutauschen. */
function bestClimbVariant() {
  const w = routeCtx.wish;
  if ((w !== "flat" && w !== "hill") || variants.length < 2) return -1;
  let pick = -1, bestAsc = null;
  for (let i = 0; i < variants.length; i++) {
    const asc = climbOf(variants[i]);
    if (asc == null) return -1;            // erst markieren, wenn alle Profile da sind
    if (bestAsc === null || (w === "flat" ? asc < bestAsc : asc > bestAsc)) { bestAsc = asc; pick = i; }
  }
  return pick;
}

/* Nicht-aktive Varianten sind roh; sie werden erst beim Auswählen nachbearbeitet. */
async function activateVariant(i) {
  if (busy || !variants[i] || i === activeVariant) return;
  activeVariant = i;
  drawRoute(variants[i]);
  showRouteStatus(variants[i]);
  if (variants[i].polished || !start) return;
  busy = true;
  setStatus(`<span class="spinner spinner-inline"></span> ${t("progress.polish", { n: i + 1 })}`);
  try {
    const better = await polish(variants[i], start, routeCtx.targetM, routeCtx.profile, routeCtx.tol);
    variants[i] = better;
    if (activeVariant === i) { drawRoute(better, { fit: false }); showRouteStatus(better); }
  } catch { showRouteStatus(variants[i]); }
  finally { busy = false; }
}

function showRouteStatus(route) {
  setStatusLive(() => routeStatusHtml(route));
}

/* Eigene Funktion, damit dieselbe Zeile nach einem Sprachwechsel noch einmal
   entstehen kann – ohne die Route neu zu berechnen. */
function routeStatusHtml(route) {
  const tol = routeCtx.tol ?? settings.tolerance / 100;
  const devPct = nfmt((route.dev || 0) * 100, 1);
  const ovPct = nfmt((route.overlap || 0) * 100, 1);
  const cls = (route.dev || 0) <= tol ? "ok" : "warn";
  const ovCls = (route.overlap || 0) <= GOOD_OVERLAP ? "ok" : "warn";
  const target = routeCtx.km ? t("status.target", { km: nfmt(routeCtx.km), dev: devPct }) : "";
  const trimNote = (route.repaired ? t("status.repaired", { n: route.repaired }) : "") +
                   (route.trimmed ? t("status.trimmed") : "");
  const vNote = variants.length > 1
    ? t("status.variantOf", { i: activeVariant + 1, n: variants.length }) : "";
  const note = cls === "warn" ? t("status.tolMissed") : "";
  const asc = climbOf(route);
  const hmNote = asc != null ? " · " + t("unit.climb", { n: asc }) : "";
  return `<span class="${cls}">${fmtDist(route.distance)}</span>${target} · ${t("status.approx", { dur: fmtDur(route.duration) })}` +
         `${t("status.dupl")}<span class="${ovCls}">${ovPct} %</span>${hmNote}${trimNote}${vNote}${note}${climbNote()}`;
}

/* Was der Höhen-Wunsch bei DIESER Route bewirkt hat – nicht, was gerade
   eingestellt ist. Und wenn die Gegend nichts hergab, steht das auch da. */
function climbNote() {
  const w = routeCtx.wish;
  if (w !== "flat" && w !== "hill") return "";
  const name = climbUi(w).name;
  if (routeCtx.terrainFailed) return t("climb.note.failed", { name });
  if (routeCtx.terrainFlat) return t("climb.note.flat", { name });
  return t("climb.note.on", { name });
}

function fmtDist(m) {
  return m >= 1000 ? nfmt(m / 1000, 2) + " km" : Math.round(m) + " m";
}
function fmtDur(s) {
  const h = Math.floor(s / 3600), min = Math.round((s % 3600) / 60);
  return h ? `${h} h ${min} min` : `${min} min`;
}

/* Beendet eine laufende Hintergrundsuche (neue Erzeugung, neuer Startpunkt,
   geladene Route). Die alte Suche merkt das am veralteten Token. */
function cancelSearch() {
  genToken++;
  if (searching) { searching = false; renderVariantChips(); }
}

async function generate() {
  if (busy) return;
  if (!start) { toast(t("toast.needStart")); return; }
  const km = parseFloat(distInput.value);
  if (!(km > 0)) { toast(t("toast.badDist")); return; }
  const meta = modeMeta(mode);
  if (km > meta.warnKm && !confirm(t("confirm.longDist", { km: nfmt(km), mode: modeName(mode) }))) return;

  cancelSearch();
  const token = genToken;
  const cancelled = () => token !== genToken;

  busy = true;
  genBtn.disabled = true; variantBtn.disabled = true; $("backBtn").disabled = true;
  genBtn.innerHTML = `<span class="spinner"></span>${t("btn.generate.busy")}`;
  clearRoute();
  routeCtx = { targetM: km * 1000, profile: mode, tol: settings.tolerance / 100, km,
               wish: settings.climbWish };

  try {
    const res = await makeRoundTrip(start, km * 1000, mode, msg => { if (!cancelled()) setStatus(msg); }, cancelled);
    if (cancelled()) return;
    if (!res) throw new Error(t("err.noRoute"));
    routeCtx.terrainFailed = res.ctx.terrainFailed;
    routeCtx.terrainFlat = !!(res.ctx.terrain && res.ctx.terrain.flat);
    variants = [res.cand]; activeVariant = 0;
    drawRoute(res.cand);
    showRouteStatus(res.cand);
    searchMoreVariants(res.ctx, res.nextSeed);   // läuft weiter, während die Route schon steht
  } catch (e) {
    if (!cancelled()) setStatus(`<span class="err">${e.message}</span>`);
  } finally {
    busy = false;
    genBtn.disabled = false;
    genBtn.textContent = t("btn.generate");
    variantBtn.disabled = !lastRoute;
    $("backBtn").disabled = false;
  }
}

/* Weitere Vorschläge im Hintergrund – jeder Fund erscheint als Chip und als
   gestrichelte Linie, ohne die schon angezeigte Route anzutasten. */
function searchMoreVariants(ctx, fromSeed) {
  if (fromSeed >= MAX_SEEDS || ctx.requests >= REQUEST_BUDGET) return;
  searching = true;
  renderVariantChips();
  const token = genToken;
  collectVariants(ctx, fromSeed, cand => {
    variants.push(cand);
    queueElev(cand, token);       // Höhenmeter für den Chip, im Hintergrund
    drawGhosts();
    renderVariantChips();
    if (variants.length === 2) tourMark("variants");   // jetzt gibt es etwas zu erklären
    if (!busy && lastRoute) showRouteStatus(lastRoute);   // „Variante 1/2“ nachziehen
    return variants.length;
  }).catch(() => {}).finally(() => {
    if (ctx.cancelled()) return;
    searching = false;
    renderVariantChips();
  });
}

function escapeXml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function gpxString(coords, name) {
  const pts = coords.map(c =>
    `      <trkpt lat="${c[0].toFixed(6)}" lon="${c[1].toFixed(6)}"></trkpt>`).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Roundtrip" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>${escapeXml(name)}</name>
    <trkseg>
${pts}
    </trkseg>
  </trk>
</gpx>`;
}

function gpxFileName(name) {
  return (name.replace(/[^\wäöüÄÖÜß\- ]+/g, "").trim().replace(/\s+/g, "_") || "roundtrip") + ".gpx";
}

function downloadGPX(coords, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([gpxString(coords, name)], { type: "application/gpx+xml" }));
  a.download = gpxFileName(name);
  a.click();
  URL.revokeObjectURL(a.href);
}

function routeTitle(route) {
  return t("route.title", { dist: fmtDist(route.distance), mode: modeName(mode) });
}

function exportGPX() {
  if (!lastRoute) return;
  downloadGPX(lastRoute.coords, routeTitle(lastRoute));
}

/* ================= Höhenprofil =================
   Die Route wird auf 100 gleich weit entfernte Punkte heruntergerechnet
   (Open-Meteo erlaubt genau so viele pro Anfrage) und als kleines
   Flächendiagramm unter dem Status gezeichnet. Auf- und Abstieg werden mit
   einer 3-m-Hysterese summiert, sonst addiert das Rauschen des Höhenmodells
   auf jeder flachen Runde hunderte Meter. */
let elevData = null;

/* n gleichmäßig über die Route verteilte Punkte, Anfang und Ende inklusive */
function sampleAlong(coords, n) {
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + segLen(coords[i - 1], coords[i]));
  const total = cum[cum.length - 1];
  const pts = [];
  if (coords.length < 2 || !total) return { pts: coords.map(c => ({ lat: c[0], lon: c[1], pos: 0 })), total: 0 };
  let j = 0;
  for (let k = 0; k < n; k++) {
    const d = total * k / (n - 1);
    while (j < cum.length - 2 && cum[j + 1] < d) j++;
    const seg = cum[j + 1] - cum[j];
    const t = seg > 0 ? (d - cum[j]) / seg : 0;
    pts.push({ lat: coords[j][0] + (coords[j + 1][0] - coords[j][0]) * t,
               lon: coords[j][1] + (coords[j + 1][1] - coords[j][1]) * t, pos: d });
  }
  return { pts, total };
}

/* Das Höhenmodell (Copernicus, 90-m-Raster) liefert auf flachem Gelände
   Sprünge von mehreren Metern zwischen Nachbarpunkten. Eine Hysterese allein
   fängt das nicht ab – ein Zickzack von ±2 m ergibt Sprünge von 4 m und würde
   sich auf jeder flachen Runde zu hunderten Höhenmetern aufaddieren. Deshalb
   erst über ein Streckenfenster mitteln, dann summieren. Echte Anstiege ziehen
   sich über hunderte Meter und bleiben dabei erhalten. */
function smoothElev(elev, windowM = ELEV_SMOOTH_M) {
  const half = windowM / 2;
  return elev.map((s, i) => {
    let sum = 0, n = 0;
    for (let j = i; j >= 0 && s.d - elev[j].d <= half; j--) { sum += elev[j].e; n++; }
    for (let j = i + 1; j < elev.length && elev[j].d - s.d <= half; j++) { sum += elev[j].e; n++; }
    return { ...s, e: sum / n };
  });
}

function elevStats(elev) {
  let asc = 0, desc = 0, anchor = elev[0].e, min = Infinity, max = -Infinity;
  for (const s of elev) {
    const d = s.e - anchor;
    if (d >= ELEV_NOISE_M) { asc += d; anchor = s.e; }
    else if (d <= -ELEV_NOISE_M) { desc -= d; anchor = s.e; }
    if (s.e < min) min = s.e;
    if (s.e > max) max = s.e;
  }
  return { asc, desc, min, max };
}

function hideElevation() {
  elevData = null;
  $("elevBox").classList.remove("show");
  $("elevChart").innerHTML = "";
  $("elevTip").textContent = "";
  if (elevMarker) { elevMarker.remove(); elevMarker = null; }
}

/* Der freie Höhen-Dienst hängt gelegentlich; ohne Abbruch bliebe die Anzeige
   ewig auf „wird geladen“ stehen. Also: Zeitlimit und ein zweiter Versuch. */
async function fetchElev(url) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ELEV_TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) {
      if (attempt) throw e;
      await sleep(800);
    } finally { clearTimeout(timer); }
  }
}

/* Das Höhenprofil einer Route holen, ohne die Anzeige anzufassen – so kommen
   auch die Varianten im Hintergrund zu ihren Höhenmetern. */
async function fetchRouteElev(route) {
  const { pts } = sampleAlong(route.coords, ELEV_SAMPLES);
  const lat = pts.map(p => p.lat.toFixed(5)).join(",");
  const lon = pts.map(p => p.lon.toFixed(5)).join(",");
  const data = await fetchElev(`${ELEV_API}?latitude=${lat}&longitude=${lon}`);
  if (!data || !Array.isArray(data.elevation)) throw new Error("keine Daten");
  const elev = [];
  let lastE = null;
  pts.forEach((p, i) => {
    let e = data.elevation[i];
    if (e === null || e === undefined || isNaN(e)) e = lastE;   // Lücken überbrücken
    if (e === null || e === undefined) return;
    lastE = e;
    elev.push({ d: p.pos, e, lat: +p.lat.toFixed(5), lon: +p.lon.toFixed(5) });
  });
  if (elev.length < 2) throw new Error("keine Daten");
  return elev;
}

/* Echte Höhenmeter einer Route – nur aus geladenen Profildaten, nie geschätzt. */
function climbOf(route) {
  if (!route) return null;
  if (route._asc != null) return route._asc;
  if (!route.elev || route.elev.length < 2) return null;
  return (route._asc = Math.round(elevStats(smoothElev(route.elev)).asc));
}

/* Varianten holen ihr Profil im Hintergrund nach (höchstens MAX_VARIANTS
   Anfragen, nacheinander): Das bringt die Höhenmeter auf die Chips und macht
   das Umschalten später ohne Ladebalken. */
let elevQueue = Promise.resolve();
function queueElev(route, token) {
  if (!route || route.elev || route._elevBusy) return;
  route._elevBusy = true;
  elevQueue = elevQueue.then(async () => {
    if (token !== genToken) return;
    try {
      route.elev = await fetchRouteElev(route);
      if (token === genToken) renderVariantChips();
    } catch { /* Höhen sind Beiwerk – die Route steht auch ohne */ }
    finally { route._elevBusy = false; }
  });
}

async function loadElevation(route) {
  const seq = ++elevSeq;
  if (route.elev && route.elev.length > 1) { renderElevation(route.elev); return; }
  if (!route.coords || route.coords.length < 2) return;
  const box = $("elevBox");
  box.classList.add("show", "loading");
  box.classList.remove("failed");
  $("elevSummary").innerHTML = `<span class="spinner spinner-inline"></span> ${t("elev.loading")}`;
  $("elevRange").textContent = "";
  $("elevChart").innerHTML = "";
  try {
    const elev = await fetchRouteElev(route);
    if (seq !== elevSeq) return;                       // inzwischen andere Route
    route.elev = elev;                                  // an der Route merken (auch fürs Speichern)
    renderElevation(elev);
    renderVariantChips();                               // Höhenmeter auf dem eigenen Chip nachziehen
  } catch (e) {
    if (seq !== elevSeq) return;
    // Nicht spurlos verschwinden lassen – der Dienst ist nur gerade nicht erreichbar
    box.classList.add("failed");
    box.classList.remove("loading");
    $("elevSummary").textContent = t("elev.failed");
    $("elevRange").innerHTML = `<button class="linkbtn" type="button" id="elevRetry">${t("elev.retry")}</button>`;
    $("elevRetry").onclick = () => loadElevation(route);
    $("elevChart").innerHTML = "";
    $("elevTip").textContent = "";
  }
}

function renderElevation(raw) {
  const svg = $("elevChart");
  const box = $("elevBox");
  box.classList.add("show");
  box.classList.remove("loading", "failed");
  // Gezeichnet und gezählt wird die geglättete Reihe – roh bleibt sie nur
  // gespeichert, damit sich die Glättung später ändern lässt.
  const elev = smoothElev(raw);
  const st = elevStats(elev);
  const total = elev[elev.length - 1].d;
  $("elevSummary").innerHTML = t("elev.summary", { asc: Math.round(st.asc), desc: Math.round(st.desc) });
  $("elevRange").textContent = t("elev.range", { min: Math.round(st.min), max: Math.round(st.max) });

  const W = Math.max(220, svg.clientWidth || svg.getBoundingClientRect().width || 280), H = 78;
  const padL = 4, padR = 4, padT = 8, padB = 14;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const span = Math.max(10, st.max - st.min);          // mind. 10 m, sonst wirkt jede Delle wie ein Berg
  const mid = (st.max + st.min) / 2;
  const lo = mid - span / 2, hi = mid + span / 2;
  const px = d => x0 + (x1 - x0) * (total ? d / total : 0);
  const py = e => y1 - (y1 - y0) * ((e - lo) / (hi - lo));

  let line = "", area = "";
  elev.forEach((s, i) => {
    const X = px(s.d).toFixed(1), Y = py(s.e).toFixed(1);
    line += (i ? "L" : "M") + X + " " + Y;
  });
